<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contrato Digital — Cibele Matozo Fotografia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF9F4; --paper-raised:#FFFFFF; --ink:#221F1C; --ink-soft:#6B6459;
    --rule:#DCD4C4; --gold:#A8791E; --gold-soft:#F1E6CC; --error:#B23B2E;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Work Sans',sans-serif;-webkit-font-smoothing:antialiased;}
  .app{max-width:640px;margin:0 auto;padding:0 20px 90px;}
  header{position:sticky;top:0;background:var(--paper);z-index:5;padding:18px 0 0;}
  header .row{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--rule);}
  header .wordmark{font-size:12.5px;letter-spacing:0.1em;color:var(--ink-soft);}
  header .wordmark strong{color:var(--ink);}
  .progress-track{height:3px;background:var(--rule);margin-top:14px;border-radius:2px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--gold);transition:width .25s ease;width:0%;}
  .progress-label{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}

  main{padding-top:26px;min-height:60vh;}
  .step{display:block;animation:fadeIn .2s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .step h2{font-family:'Fraunces',serif;font-weight:500;font-size:24px;margin:0 0 6px;}
  .step .step-sub{font-size:14px;color:var(--ink-soft);line-height:1.55;margin:0 0 22px;max-width:52ch;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%;font-family:'Work Sans',sans-serif;font-size:15px;color:var(--ink);
    background:var(--paper-raised);border:1px solid var(--rule);border-radius:3px;
    padding:11px 12px;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);}
  .field .err{display:none;margin-top:5px;}
  .field.has-error input, .field.has-error select, .field.has-error textarea{border-color:var(--error);}
  .field.has-error .err{display:block;}

  .option-cards{display:grid;gap:10px;}
  .option-card{border:1px solid var(--rule);border-radius:3px;padding:14px 16px;cursor:pointer;background:var(--paper-raised);}
  .option-card .oc-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .option-card .oc-title{font-family:'Fraunces',serif;font-size:16.5px;}
  .option-card .oc-desc{font-size:13px;color:var(--ink-soft);margin-top:5px;line-height:1.5;}
  .option-card.selected{border-color:var(--gold);background:var(--gold-soft);}

  .yn-row{display:flex;gap:10px;}
  .yn-btn{flex:1;border:1px solid var(--rule);border-radius:3px;padding:14px;text-align:center;font-size:14px;line-height:1.5;background:var(--paper-raised);cursor:pointer;}
  .yn-btn.selected{border-color:var(--gold);background:var(--gold-soft);}
  .yn-btn.autoriza.selected{border-color:#5C7A52;background:#E7EEE1;}
  .yn-btn.naoautoriza.selected{border-color:var(--error);background:#F5E3E0;}

  .summary-table{border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--paper-raised);}
  .summary-table .li{display:flex;justify-content:space-between;gap:14px;padding:12px 16px;font-size:14.5px;border-bottom:1px solid var(--rule);}
  .summary-table .li span:last-child{text-align:right;}
  .summary-table .li:last-child{border-bottom:none;}
  .summary-table .total{font-family:'Fraunces',serif;font-size:19px;background:var(--gold-soft);}

  .contract-pane{border:1px solid var(--rule);border-radius:3px;background:var(--paper-raised);max-height:360px;overflow-y:auto;padding:18px;font-size:13px;line-height:1.65;}
  .contract-pane h3{font-family:'Fraunces',serif;font-size:14.5px;margin:18px 0 6px;}
  .contract-pane h3:first-child{margin-top:0;}
  .contract-pane p{margin:0 0 10px;color:var(--ink);}
  .scroll-hint{font-size:12px;color:var(--gold);margin-top:8px;}
  .scroll-hint.done{color:#5C7A52;}

  .declare-list{display:flex;flex-direction:column;gap:12px;}
  .declare-item{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.5;cursor:pointer;}
  .declare-item input{margin-top:3px;}

  .method-tabs{display:flex;gap:8px;margin-bottom:18px;}
  .method-tab{flex:1;text-align:center;padding:10px;border:1px solid var(--rule);border-radius:3px;font-size:13.5px;cursor:pointer;background:var(--paper-raised);}
  .method-tab.selected{border-color:var(--ink);background:var(--ink);color:var(--paper);}
  .method-panel{display:none;}
  .method-panel.active{display:block;}

  .canvas-wrap{position:relative;border-bottom:1.5px solid var(--ink);background:#FDFCF9;}
  #pad{display:block;width:100%;height:180px;touch-action:none;cursor:crosshair;}
  .placeholder{position:absolute;left:0;right:0;top:0;bottom:12px;display:flex;align-items:center;justify-content:center;font-family:'Caveat',cursive;font-size:24px;color:#C6BFAF;pointer-events:none;transition:opacity .15s ease;}
  .pad-actions{display:flex;gap:10px;margin-top:12px;}

  button{font-family:'Work Sans',sans-serif;cursor:pointer;border-radius:3px;transition:opacity .15s ease;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  .ghost-btn{background:transparent;border:1px solid var(--rule);color:var(--ink);font-size:13.5px;padding:9px 14px;}
  .ghost-btn:not(:disabled):hover{border-color:var(--ink-soft);}

  .nav-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:28px;padding-top:20px;border-top:1px solid var(--rule);}
  .nav-btn{padding:12px 20px;font-size:14px;border:none;}
  .btn-back{background:transparent;color:var(--ink-soft);}
  .btn-next{background:var(--ink);color:var(--paper);margin-left:auto;}
  .btn-next:not(:disabled):hover{opacity:.88;}

  .err{color:var(--error);font-size:12.5px;}

  .price-pill{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);
    padding:9px 18px;border-radius:20px;font-size:13px;box-shadow:0 8px 20px -6px rgba(0,0,0,.4);z-index:6;}
  .price-pill b{color:#F1D98A;margin-left:6px;}

  .success-box{text-align:center;padding:10px 0;}
  .success-box .check{font-size:38px;}
  .success-box dl{display:inline-grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;font-size:13.5px;margin-top:18px;}
  .success-box dt{color:var(--ink-soft);}
  .success-box dd{margin:0;}

  .spinner-wrap{text-align:center;padding:70px 20px;color:var(--ink-soft);}
  .spinner{width:28px;height:28px;margin:0 auto 14px;border-radius:50%;
    border:3px solid var(--rule);border-top-color:var(--gold);animation:girar .8s linear infinite;}
  @keyframes girar{to{transform:rotate(360deg);}}
  .pagina-erro{text-align:center;padding:70px 20px 40px;}
  .pagina-erro h2{font-family:'Fraunces',serif;font-weight:500;font-size:22px;margin:0 0 10px;}
  .pagina-erro p{color:var(--ink-soft);font-size:14px;line-height:1.6;max-width:44ch;margin:0 auto;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="row">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <rect x="2" y="7" width="20" height="14" rx="2" stroke="#221F1C" stroke-width="1.4"/>
        <path d="M8 7L9.6 4.4H14.4L16 7" stroke="#221F1C" stroke-width="1.4" stroke-linejoin="round"/>
        <circle cx="12" cy="14" r="4.2" stroke="#221F1C" stroke-width="1.4"/>
      </svg>
      <span class="wordmark"><strong>CIBELE MATOZO</strong> · contrato digital</span>
    </div>
    <div class="progress-track" id="progressTrack" hidden><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel"></div>
  </header>
  <main id="stepsContainer"><div class="spinner-wrap"><div class="spinner"></div>Carregando seu contrato…</div></main>
</div>
<div class="price-pill" id="pricePill" hidden>Total <b id="pricePillValue"></b></div>

<script src="https://cdn.jsdelivr.net/npm/pocketbase@0.21.5/dist/pocketbase.umd.js"></script>
<!-- jsPDF (v3.26 — Fase 4): gera o PDF do contrato assinado no navegador do
     cliente, mesma versão já usada pelo Orçamento (orcamentoPdf.js). -->
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="assets/js/config.js?v=3.23.0"></script>
<script src="assets/js/pbCore.js?v=3.15.1"></script>
<script>
const params = new URLSearchParams(window.location.search);
const TOKEN = (params.get('token') || '').trim();

let REC = null;
let SNAP = null;

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatBRL(n){ return (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function enderecoContratante_(c){
  return `Rua ${c.rua}, nº ${c.numero}${c.complemento?(', '+c.complemento):''} — ${c.bairro}, ${c.cidade}/${c.uf}`;
}

function bindText(container, id, key, mask){
  const input = container.querySelector('#'+id);
  input.addEventListener('input', () => {
    let v = input.value;
    if (mask) { v = mask(v); input.value = v; }
    state[key] = v;
    const field = input.closest('.field'); if(field) field.classList.remove('has-error');
  });
}
function requireField(el,id,condition,msg){
  const input = el.querySelector('#'+id);
  const field = input.closest('.field');
  let err = field.querySelector('.err');
  if(!err){ err=document.createElement('div'); err.className='err'; field.appendChild(err); }
  if(!condition){ field.classList.add('has-error'); err.textContent = msg; return false; }
  field.classList.remove('has-error'); return true;
}
function showTopError(el,msg){
  let err = el.querySelector('.top-err');
  if(!err){
    err=document.createElement('div');
    err.className='err top-err';
    err.style.margin='14px 0 0';
    const navRow = el.querySelector('.nav-row');
    if(navRow) el.insertBefore(err, navRow); else el.appendChild(err);
  }
  err.textContent = msg;
}
function clearTopError(el){ const e=el.querySelector('.top-err'); if(e) e.remove(); }
function requireStepChoice(el, condition, msg){
  if(!condition){ showTopError(el,msg); return false; }
  clearTopError(el); return true;
}
function ensaioLocalLabel(){
  if(state.ensaioLocal==='local') return 'No local do evento';
  if(state.ensaioLocal==='curitiba') return 'Em Curitiba';
  if(state.ensaioLocal==='outro') return 'Outro local';
  if(state.ensaioLocal==='nao_desejo') return 'Ensaio pré-evento dispensado pelo CONTRATANTE';
  return '—';
}

const state = {
  ensaioLocal:'', ensaioEndereco:'',
  modalidadeVideo:'',
  autorizacaoImagem:null,
  declaracoes:{d1:false,d2:false,d3:false,d4:false,d5:false,d6:false,d7:false},
  contratoLido:false,
  metodoAssinatura:'desenho',
  aceiteNome:'', aceiteNomeConfirma:'', aceiteDeclara:false,
  assinaturaPNG:null, temTraco:false,
};
function buildClauses(){
  const c = SNAP.contratante, e = SNAP.evento;
  const endereco = enderecoContratante_(c);
  const itensInclusosTxt = (SNAP.pacoteCatalogo && SNAP.pacoteCatalogo.itensInclusos)
    ? SNAP.pacoteCatalogo.itensInclusos.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>'• '+s).join('\n')
    : '';
  const valorTxt = `Valor do pacote: ${formatBRL(e.valorPacote)}`
    + (e.desconto>0 ? `\nDesconto: ${formatBRL(e.desconto)}` : '')
    + `\nValor total: ${formatBRL(e.valorFinal)}`;
  const parcelasTxt = (SNAP.parcelas||[]).length
    ? SNAP.parcelas.map(p=>`${p.tipo||'Parcela'}${p.total>1?(' '+p.numero+'/'+p.total):''}${p.vencimento?(' — vencimento '+p.vencimento):''} — ${formatBRL(p.valor)}`).join('\n')
    : '';
  const videoTxt = SNAP.temVideo
    ? (state.modalidadeVideo==='shortfilm'
        ? 'SHORT FILM – MELHORES MOMENTOS: vídeo editado com os principais momentos do evento, com duração de até 30 minutos.'
        : 'EVENTO NA ÍNTEGRA: material contendo os momentos registrados durante o evento, organizados e editados, buscando contemplar a totalidade dos momentos relevantes registrados pela equipe.')
    : 'Não aplicável aos serviços contratados.';
  const imagemTxt = state.autorizacaoImagem==='autorizo'
    ? 'AUTORIZO a utilização para portfólio, redes sociais, site, publicidade e materiais promocionais da Cibele Matozo Fotografia.'
    : 'NÃO AUTORIZO a utilização para essas finalidades.';

  const lista = [
    { numerado:false, t:'QUALIFICAÇÃO DAS PARTES', b:`CONTRATADA: Cibele Matozo de Lara, nome empresarial "69.546.199 Cibele Matozo de Lara" (nome fantasia Cibele Matozo Fotografia), microempreendedora individual (MEI), inscrita no CNPJ sob o nº 69.546.199/0001-54, CPF nº 066.877.109-74, com endereço comercial na Rua Dilermando Pereira de Almeida, nº 394, casa 5, Pinheirinho, Curitiba, Paraná, CEP 81870-070, e-mail cibelematozofotografia@gmail.com, WhatsApp (41) 99602-5409, doravante denominada CONTRATADA.\n\nCONTRATANTE: ${c.nome}, CPF nº ${c.cpf}, residente e domiciliado(a) à ${endereco}, WhatsApp ${c.whatsapp}, e-mail ${c.email}, doravante denominado(a) CONTRATANTE.` },
    { t:'DO OBJETO DO CONTRATO', b:`O presente contrato tem por objeto a prestação de serviços profissionais de fotografia e/ou filmagem para o evento abaixo qualificado, de acordo com o pacote e os serviços contratados pelo CONTRATANTE.\n\nTipo de evento: ${e.tipoEvento}\nData: ${e.dataEvento}   Horário: ${e.horaInicio||'—'} às ${e.horaFim||'—'}\nLocal: ${e.local}${e.cidade?(' — '+e.cidade):''}` },
    { t:'DO PACOTE E DO VALOR CONTRATADOS', b:`Pacote: ${e.pacote||'—'}\nServiços contratados: ${e.servicoContratado||'—'}${SNAP.pacoteCatalogo && SNAP.pacoteCatalogo.descricao ? ('\n'+SNAP.pacoteCatalogo.descricao) : ''}${itensInclusosTxt ? ('\n\nItens inclusos:\n'+itensInclusosTxt) : ''}\n\n${valorTxt}` },
    { t:'DA COBERTURA DO EVENTO', b:`A cobertura do evento será realizada conforme o pacote contratado e durante o período previamente acordado entre as partes.\n\nA expressão "cobertura completa do evento", quando utilizada na descrição de determinado pacote, refere-se à cobertura realizada durante o período contratado, não representando obrigação de registro contínuo e ininterrupto de todos os segundos do evento.\n\nAtrasos decorrentes de responsabilidade do CONTRATANTE, convidados, familiares, cerimonial, buffet, espaço de eventos, fornecedores ou terceiros não implicarão automaticamente na extensão do período contratado. Horas adicionais poderão ser contratadas mediante disponibilidade e pagamento correspondente.` },
    { t:'DO VALOR E DAS CONDIÇÕES DE PAGAMENTO', b:`O valor total é o indicado na Cláusula anterior, podendo ser alterado mediante negociação expressamente registrada neste contrato.\n\nForma de pagamento combinada: ${e.formaPagamentoCombinada || 'a combinar diretamente com a CONTRATADA'}.${parcelasTxt ? ('\n\nPlano de parcelas combinado:\n'+parcelasTxt) : ''}\n\nCartão de crédito, quando utilizado, poderá ser parcelado em até 10x, com taxas da operadora sob responsabilidade do CONTRATANTE. PIX, cartão de débito e dinheiro seguem a forma de pagamento combinada acima.` },
    { t:'DA RESERVA DA DATA', b:`A data somente será considerada efetivamente reservada após a confirmação do pagamento da entrada ou do valor estabelecido para reserva. Enquanto não houver confirmação, a data poderá ser disponibilizada para outros interessados.` },
    { t:'DO CANCELAMENTO, DESISTÊNCIA E REEMBOLSO', b:`O cancelamento deverá ser solicitado por escrito, preferencialmente por WhatsApp ou e-mail. Quando aplicável, será observado o direito de arrependimento previsto na legislação de proteção ao consumidor.\n\nCancelamento com antecedência igual ou superior a 60 dias: restituição de 80% dos valores pagos, com retenção de 20% pela reserva da data e custos administrativos. Entre 30 e 59 dias: restituição de 50%. Inferior a 30 dias: restituição de 20%, sem prejuízo da análise de custos comprovadamente realizados e não recuperáveis.\n\nEm caso de cancelamento imputável à CONTRATADA, sem substituição por profissional compatível ou nova data acordada, serão restituídos os valores correspondentes aos serviços não prestados, observada a legislação aplicável.` },
    { t:'DA REMARCAÇÃO DO EVENTO', b:`A remarcação dependerá de comunicação prévia e disponibilidade da agenda da CONTRATADA. Havendo disponibilidade, os valores pagos poderão ser aproveitados para a nova data. Em caso de caso fortuito ou força maior, as partes buscarão de boa-fé a realização do serviço em nova data.` },
    { t:'DOS PRAZOS E DA ENTREGA DOS ARQUIVOS', b:`As fotografias serão entregues após seleção, tratamento e edição${SNAP.pacoteCatalogo && SNAP.pacoteCatalogo.prazoEntrega ? (', no prazo estimado de '+SNAP.pacoteCatalogo.prazoEntrega) : ''}. Os arquivos digitais serão disponibilizados por link ou plataforma indicada pela CONTRATADA.\n\nOs prazos poderão ser prorrogados quando houver atraso do CONTRATANTE em seleção, aprovação, fornecimento de informações ou outra etapa sob sua responsabilidade.` },
    { t:'DA GUARDA, ARMAZENAMENTO E RESPONSABILIDADE PELOS ARQUIVOS', b:`Após a disponibilização dos arquivos, o CONTRATANTE será responsável pelo download e por manter cópias de segurança.\n\nA CONTRATADA manterá, sempre que tecnicamente possível, cópia de segurança dos arquivos finais entregues pelo período de 90 (noventa) dias, contado da disponibilização da entrega final. Encerrado o prazo, a CONTRATADA poderá excluir definitivamente os arquivos, sem necessidade de aviso adicional.\n\nRecomenda-se que o CONTRATANTE mantenha ao menos duas cópias de segurança dos materiais.` },
    { t:'DA SELEÇÃO E EDIÇÃO DAS FOTOGRAFIAS', b:`As fotografias serão selecionadas e tratadas conforme critérios técnicos e artísticos da CONTRATADA. Fotografias tecnicamente inadequadas, duplicadas, testes, fora de foco, com olhos fechados ou sem qualidade compatível poderão não integrar a entrega.\n\nArquivos RAW, originais de câmera, arquivos de projeto e materiais intermediários não fazem parte da entrega, salvo contratação expressa.` },
    { t:'DO ÁLBUM E DA SELEÇÃO DAS IMAGENS', b:`Nos pacotes com álbum, o CONTRATANTE receberá os arquivos digitais editados e deverá selecionar, dentre eles, as imagens para composição do álbum. O prazo para seleção será de 20 (vinte) dias corridos a partir da disponibilização dos arquivos.\n\nApós 20 dias, poderá ser concedido prazo adicional de 10 dias. Persistindo a ausência de seleção, a CONTRATADA poderá, mediante comunicação, selecionar as imagens segundo critérios técnicos e artísticos.` },
  ];
  if (SNAP.temVideo){
    lista.push({ t:'DA MODALIDADE E ENTREGA DO VÍDEO', b:`Modalidade escolhida: ${videoTxt}\n\nA modalidade "Evento na Íntegra" não representa entrega de arquivos brutos. Na modalidade Short Film, a duração poderá ser inferior a 30 minutos conforme a quantidade, qualidade e relevância dos registros.` });
  }
  lista.push(
    { t:'DOS DIREITOS AUTORAIS', b:`As fotografias e vídeos produzidos constituem obras protegidas pela legislação de direitos autorais. A contratação concede ao CONTRATANTE direito de uso pessoal e não comercial dos materiais entregues. Compartilhamento em redes sociais para fins pessoais é permitido. Comercialização, licenciamento ou revenda dependem de autorização expressa da CONTRATADA.` },
    { t:'DO DIREITO DE IMAGEM', b:`A cobertura poderá registrar o(s) titular(es) do evento, familiares e convidados.\n\nQuando o(s) participante(s) retratado(s) nas imagens objeto deste contrato for(em) menor(es) de idade, a autorização abaixo é prestada pelo responsável legal, na qualidade de CONTRATANTE qualificado(a) na abertura deste instrumento.\n\n${imagemTxt}` },
    { t:'DA PROTEÇÃO DE DADOS PESSOAIS', b:`Os dados pessoais serão tratados para execução do contrato, comunicação, cobrança, prestação dos serviços, entrega dos materiais e cumprimento de obrigações legais.\n\nNo tratamento de dados pessoais de crianças, será observado o melhor interesse da criança e, quando aplicável, consentimento específico de pelo menos um dos pais ou responsável legal.` },
    { t:'DAS RESPONSABILIDADES DO CONTRATANTE', b:`Fornecer informações corretas; comunicar alterações; garantir acesso da equipe; informar restrições do local; cumprir pagamentos; realizar seleções e aprovações nos prazos; baixar e guardar os arquivos; e comunicar solicitações especiais.` },
    { t:'DAS RESPONSABILIDADES DA CONTRATADA', b:`Prestar os serviços com zelo e profissionalismo; disponibilizar profissionais e equipamentos compatíveis; realizar tratamento e edição; entregar os materiais previstos; e cumprir os prazos, ressalvadas as hipóteses previstas neste contrato.` },
    { t:'DA EQUIPE E SUBSTITUIÇÃO DE PROFISSIONAIS', b:`Em situações excepcionais, a CONTRATADA poderá substituir fotógrafo, cinegrafista, Storymaker ou outro profissional por pessoa de qualificação compatível, especialmente em casos de doença, acidente, emergência, impedimento, caso fortuito ou força maior.` },
    { t:'DE FALHAS TÉCNICAS E PERDA DE MATERIAL', b:`A CONTRATADA adotará procedimentos técnicos e medidas razoáveis para preservação dos arquivos. Em caso de falha técnica imprevisível, defeito, corrupção de arquivos ou outro evento alheio à sua vontade, serão adotadas medidas tecnicamente possíveis para recuperação.` },

function initSignaturePad(container){
  const canvas = container.querySelector('#pad');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const placeholder = container.querySelector('#placeholder');
  const undoBtn = container.querySelector('#undoBtn');
  const clearBtn = container.querySelector('#clearBtn');
  let strokes = [];
  let currentStroke = null;
  let drawing = false;

  function resizeCanvas(){
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(rect.width*dpr);
    canvas.height = Math.round(rect.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    redraw();
  }
  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    return {x:e.clientX-rect.left, y:e.clientY-rect.top};
  }
  function redraw(){
    const rect = canvas.getBoundingClientRect();
    ctx.clearRect(0,0,rect.width,rect.height);
    ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=2.4; ctx.strokeStyle='#221F1C';
    strokes.forEach(stroke=>{
      if(stroke.length<2) return;
      ctx.beginPath(); ctx.moveTo(stroke[0].x, stroke[0].y);
      for(let i=1;i<stroke.length-1;i++){
        const mx=(stroke[i].x+stroke[i+1].x)/2, my=(stroke[i].y+stroke[i+1].y)/2;
        ctx.quadraticCurveTo(stroke[i].x, stroke[i].y, mx, my);
      }
      ctx.stroke();
    });
    refresh();
  }
  function hasInk(){ return strokes.some(s=>s.length>1); }
  function refresh(){
    placeholder.style.opacity = hasInk() ? '0':'1';
    undoBtn.disabled = strokes.length===0;
    clearBtn.disabled = strokes.length===0;
    state.temTraco = hasInk();
    state.assinaturaPNG = hasInk() ? canvas.toDataURL('image/png') : null;
  }
  canvas.addEventListener('pointerdown', e=>{
    drawing=true; canvas.setPointerCapture(e.pointerId);
    currentStroke=[getPos(e)]; strokes.push(currentStroke);
  });
  canvas.addEventListener('pointermove', e=>{ if(!drawing) return; currentStroke.push(getPos(e)); redraw(); });
  function end(){ if(!drawing) return; drawing=false; currentStroke=null; refresh(); }
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('pointerleave', ()=>{ if(drawing) end(); });
  clearBtn.addEventListener('click', ()=>{ strokes=[]; redraw(); });
  undoBtn.addEventListener('click', ()=>{ strokes.pop(); redraw(); });
  window.addEventListener('resize', ()=>{ clearTimeout(window.__rtSig); window.__rtSig=setTimeout(resizeCanvas,150); });
  resizeCanvas();
}

function contratoGerarPdf_(clauses, protocolo){
  if (!window.jspdf || !window.jspdf.jsPDF) throw new Error('Biblioteca de PDF (jsPDF) não carregou. Verifique a conexão e recarregue a página.');
  const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, H = 297, M = 18, CW = W - 2 * M, FOOT = 18;

  const fill = c => doc.setFillColor(c[0], c[1], c[2]);
  const stroke = c => doc.setDrawColor(c[0], c[1], c[2]);
  const color = c => doc.setTextColor(c[0], c[1], c[2]);
  const serif = (sz, bold) => { doc.setFont('times', bold ? 'bold' : 'normal'); doc.setFontSize(sz); };
  const sans = (sz, bold) => { doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(sz); };

  function fundo(){ fill(C.paper); doc.rect(0, 0, W, H, 'F'); }
  function cabecalho(){
    fundo();
    color(C.ink); sans(10.5, true);
    doc.text('CIBELE MATOZO FOTOGRAFIA', M, 14, { charSpace: 0.4 });
    color(C.soft); sans(8, false);
    doc.text(`Contrato nº CMF-${new Date().getFullYear()}-${protocolo}`, W - M, 11, { align: 'right' });
    doc.text(`Assinado em ${hojePontual_()}`, W - M, 15, { align: 'right' });
    stroke(C.rule); doc.setLineWidth(0.3); doc.line(M, 19, W - M, 19);
    y = 28;
  }
  function garantir(h){ if (y + h > H - FOOT){ doc.addPage(); cabecalho(); } }
  function tituloClausula(t){
    garantir(12);
    color(C.gold); serif(11.5, true);
    const linhas = doc.splitTextToSize(t, CW);
    linhas.forEach(ln => { garantir(6); doc.text(ln, M, y); y += 5.2; });
    y += 1.5;
  }
  function paragrafo(texto){
    sans(9.5, false); color(C.ink);
    const linhas = doc.splitTextToSize(String(texto), CW);
    const lh = 4.4;
    for (const ln of linhas){ garantir(lh + 1); sans(9.5, false); color(C.ink); doc.text(ln, M, y); y += lh; }
    y += 2.5;
  }

  cabecalho();
  color(C.ink); serif(18, true);
  doc.text('Contrato de prestação de serviços', M, y); y += 9;
  stroke(C.gold); doc.setLineWidth(0.4); doc.line(M, y, M + 32, y); y += 8;

  clauses.forEach(c => {
    tituloClausula(c.t);
    c.b.split('\n\n').forEach(p => { p.split('\n').forEach(paragrafo); });
    y += 1.5;
  });

  tituloClausula('DECLARAÇÕES CONFIRMADAS PELO CONTRATANTE');
  Object.keys(DECLARACOES_TXT).forEach(k => { if (state.declaracoes[k]) paragrafo('✓ ' + DECLARACOES_TXT[k]); });

  tituloClausula('ASSINATURA');
  garantir(40);
  if (state.metodoAssinatura === 'desenho' && state.assinaturaPNG){
    paragrafo('Assinatura por desenho, registrada eletronicamente:');
    garantir(34);
    try { doc.addImage(state.assinaturaPNG, 'PNG', M, y, 70, 28); } catch(e){ /* segue sem a imagem se o navegador recusar */ }
    y += 32;
    paragrafo(SNAP.contratante.nome);
  } else {
    paragrafo('Aceite eletrônico — o CONTRATANTE declarou que o nome abaixo corresponde à sua assinatura e que está de acordo com todas as condições deste contrato:');
    serif(13, true); color(C.ink); garantir(8); doc.text(state.aceiteNome || SNAP.contratante.nome, M, y); y += 8;
  }
  paragrafo(`Protocolo CMF-${new Date().getFullYear()}-${protocolo} · assinado em ${hojePontual_()}`);

  const total = doc.getNumberOfPages();
  for (let i = 1; i <= total; i++){
    doc.setPage(i);
    stroke(C.rule); doc.setLineWidth(0.3); doc.line(M, H - 14, W - M, H - 14);
    color(C.soft); sans(7.5, false);
    doc.text('Cibele Matozo Fotografia · MEI · CNPJ 69.546.199/0001-54 · (41) 99602-5409 · cibelematozofotografia@gmail.com', M, H - 9.5);
    doc.text(`Página ${i} de ${total}`, W - M, H - 9.5, { align: 'right' });
  }
  return doc;
}
function contratoNomeArquivoPdf_(){
  return `Contrato-${contratoSlug_(SNAP.contratante.nome)}-${new Date().getFullYear()}.pdf`;
}

async function dataUrlParaBlob_(dataUrl){
  const res = await fetch(dataUrl);
  return res.blob();
}
function hojePontual_(){
  return new Date().toLocaleDateString('pt-BR');
}
async function onSubmit(){
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Enviando…';
  const protocolo = String(Date.now()).slice(-6);
  try{
    const payload = {
      id_contrato: REC.id,
      autorizacao_imagem: state.autorizacaoImagem,
      declaracoes: JSON.stringify(state.declaracoes),
      metodo_assinatura: state.metodoAssinatura,
      nome_assinatura: state.metodoAssinatura==='aceite' ? state.aceiteNome : SNAP.contratante.nome,
      ensaio_local: SNAP.ensaioPreIncluido ? state.ensaioLocal : '',
      ensaio_endereco: state.ensaioEndereco || '',
      modalidade_video: SNAP.temVideo ? state.modalidadeVideo : '',
      data_assinatura: hojePontual_(),
    };
    if (state.metodoAssinatura==='desenho' && state.assinaturaPNG){
      payload.assinatura_arquivo = await dataUrlParaBlob_(state.assinaturaPNG);
    }
    const clauses = buildClauses();
    const doc = contratoGerarPdf_(clauses, protocolo);
    const nomeArquivoPdf = contratoNomeArquivoPdf_();
    payload.pdf_arquivo = new File([doc.output('blob')], nomeArquivoPdf, { type: 'application/pdf' });
    await PB.collection('contrato_assinaturas').create(payload, { token: TOKEN });
    try { doc.save(nomeArquivoPdf); } catch(e){ /* upload já aconteceu; download local é só conveniência */ }
    try {
      const datauri = doc.output('datauristring');
      const pdfBase64 = datauri.substring(datauri.indexOf(',') + 1);
      await fetch(CRM_API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'enviarContratoAssinado', dados: {
          emailCliente: SNAP.contratante.email,
          nomeCliente: SNAP.contratante.nome,
          tituloEvento: `${SNAP.evento.tipoEvento} · ${SNAP.evento.dataEvento}`,
          pdfBase64, nomeArquivo: nomeArquivoPdf,
        }}),
      });
    } catch(e){ /* e-mail é melhor esforço — a assinatura já foi registrada mesmo se isso falhar */ }
    showResult(protocolo);
  } catch(err){
    showResult(null, (err && err.message) || String(err));
  }
}
function showResult(protocolo, error){
  const box = document.getElementById('finalResult');
  const btn = document.getElementById('submitBtn');
  if(protocolo){
    btn.style.display='none';
    document.getElementById('progressTrack').hidden = true;
    document.getElementById('progressLabel').textContent = '';
    box.innerHTML = `
      <div class="success-box">
        <div class="check">✓</div>
        <h2>Contrato assinado com sucesso!</h2>
        <p class="step-sub" style="margin:0 auto;">A Cibele Matozo Fotografia foi notificada. Qualquer dúvida, fale pelo WhatsApp (41) 99602-5409.</p>
        <dl>
          <dt>Protocolo</dt><dd>CMF-${new Date().getFullYear()}-${esc(protocolo)}</dd>
          <dt>Data/hora</dt><dd>${new Date().toLocaleString('pt-BR')}</dd>
          <dt>Evento</dt><dd>${esc(SNAP.evento.tipoEvento)} · ${esc(SNAP.evento.dataEvento)}</dd>
        </dl>
      </div>`;
  } else {
    btn.disabled=false; btn.textContent='Finalizar contratação';
    box.innerHTML = `<p class="err">Não foi possível concluir agora. ${esc(error||'')} Tente novamente em instantes.</p>`;
  }
}
function goToStep(idx){
  const steps = activeSteps();
  currentIndex = Math.max(0, Math.min(idx, steps.length-1));
  renderCurrentStep();
}
function renderCurrentStep(){
  const steps = activeSteps();
  const step = steps[currentIndex];
  const container = document.getElementById('stepsContainer');
  container.innerHTML = '<div class="step" id="stepBody"></div>';
  const body = document.getElementById('stepBody');
  step.render(body);

  const nav = document.createElement('div');
  nav.className='nav-row';
  nav.innerHTML = `
    ${currentIndex>0 ? '<button class="nav-btn btn-back" id="backBtn">Voltar</button>' : '<span></span>'}
    ${step.id!=='final' ? `<button class="nav-btn btn-next" id="nextBtn">${step.id==='intro'?'Começar':'Avançar'}</button>` : ''}
  `;
  body.appendChild(nav);
  if(currentIndex>0) document.getElementById('backBtn').addEventListener('click', ()=>goToStep(currentIndex-1));
  if(step.id!=='final'){
    document.getElementById('nextBtn').addEventListener('click', ()=>{
      if(step.validate(body)) goToStep(currentIndex+1);
    });
  }
  updateProgress();
  updatePricePill();
  window.scrollTo(0,0);
}
function updateProgress(){
  const steps = activeSteps();
  const pct = steps.length>1 ? Math.round((currentIndex/(steps.length-1))*100) : 0;
  document.getElementById('progressTrack').hidden = false;
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressLabel').textContent = `Etapa ${currentIndex+1} de ${steps.length}`;
}
function updatePricePill(){
  const pill = document.getElementById('pricePill');
  const steps = activeSteps();
  const step = steps[currentIndex];
  const showFromIdx = STEPS.findIndex(s=>s.id==='revisao');
  const currentAllIdx = STEPS.findIndex(s=>s.id===step.id);
  if(currentAllIdx>=showFromIdx && step.id!=='final'){
    pill.hidden=false;
    document.getElementById('pricePillValue').textContent = formatBRL(SNAP.evento.valorFinal);
  } else {
    pill.hidden=true;
  }
}
function mostrarErroPagina_(titulo, texto){
  document.getElementById('progressTrack').hidden = true;
  document.getElementById('stepsContainer').innerHTML = `
    <div class="pagina-erro">
      <h2>${esc(titulo)}</h2>
      <p>${esc(texto)}</p>
    </div>`;
}
function mostrarJaAssinado_(){
  document.getElementById('progressTrack').hidden = true;
  document.getElementById('stepsContainer').innerHTML = `
    <div class="pagina-erro">
      <div class="success-box"><div class="check">✓</div></div>
      <h2>Este contrato já foi assinado</h2>
      <p>Assinado em ${esc(REC.data_assinatura || '—')}. Qualquer dúvida, fale com a Cibele Matozo Fotografia pelo WhatsApp (41) 99602-5409.</p>
    </div>`;
}
async function iniciar(){
  if (!TOKEN){
    mostrarErroPagina_('Link incompleto', 'Este link não tem um código de contrato válido. Confira se você copiou o link inteiro, ou peça para a Cibele reenviar.');
    return;
  }
  try{
    pbInit();
    REC = await PB.collection('contratos').getFirstListItem(PB.filter('token = {:t}', { t: TOKEN }), { token: TOKEN });
  } catch(e){
    mostrarErroPagina_('Contrato não encontrado', 'Não encontramos um contrato válido para este link. Ele pode ter sido cancelado ou o link pode estar incorreto — fale com a Cibele Matozo Fotografia para conferir.');
    return;
  }
  if (REC.status === 'Assinado'){ mostrarJaAssinado_(); return; }
  try{
    SNAP = JSON.parse(REC.dados_snapshot);
  } catch(e){
    mostrarErroPagina_('Não foi possível abrir este contrato', 'Os dados deste contrato não puderam ser lidos. Avise a Cibele Matozo Fotografia para gerar o link novamente.');
    return;
  }
  goToStep(0);
}
iniciar();
</script>
