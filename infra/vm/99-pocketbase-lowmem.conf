# ============================================================
# Tuning de baixa RAM da VM Oracle (CRM Cibele Matozo — v3.2)
# Instalado em /etc/sysctl.d/99-pocketbase-lowmem.conf
# Shape x86 E2.1.Micro tem ~0,5 GB de RAM. Sem isto, quando a RAM
# enche (picos dos próprios agentes da Oracle), a VM entra em thrash
# e o sshd é o primeiro a sufocar ("banner exchange timeout"),
# exigindo reboot pelo Console. Estes ajustes fazem o kernel paginar
# de forma PROATIVA e manter uma folga mínima de RAM livre.
# Aplicar: sudo sysctl --system
# ============================================================

# Paginar anônimo agressivamente (padrão 60). Em box de 0,5 GB vale
# empurrar páginas ociosas pro swap e deixar RAM pro que está ativo.
vm.swappiness=100

# Reclamar cache de inode/dentry mais rápido para liberar RAM (padrão 100).
vm.vfs_cache_pressure=150

# Reserva mínima de RAM livre (~16 MB) para o kernel não ser pego de
# surpresa sob pressão e travar o atendimento de rede/SSH.
vm.min_free_kbytes=16384
