<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contrato Digital — Cibele Matozo Fotografia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF9F4; --paper-raised:#FFFFFF; --ink:#221F1C; --ink-soft:#6B6459;
    --rule:#DCD4C4; --gold:#A8791E; --gold-soft:#F1E6CC; --error:#B23B2E;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Work Sans',sans-serif;-webkit-font-smoothing:antialiased;}
  .app{max-width:640px;margin:0 auto;padding:0 20px 90px;}
  header{position:sticky;top:0;background:var(--paper);z-index:5;padding:18px 0 0;}
  header .row{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--rule);}
  header .wordmark{font-size:12.5px;letter-spacing:0.1em;color:var(--ink-soft);}
  header .wordmark strong{color:var(--ink);}
  .progress-track{height:3px;background:var(--rule);margin-top:14px;border-radius:2px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--gold);transition:width .25s ease;width:0%;}
  .progress-label{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}

  main{padding-top:26px;min-height:60vh;}
  .step{display:block;animation:fadeIn .2s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .step h2{font-family:'Fraunces',serif;font-weight:500;font-size:24px;margin:0 0 6px;}
  .step .step-sub{font-size:14px;color:var(--ink-soft);line-height:1.55;margin:0 0 22px;max-width:48ch;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%;font-family:'Work Sans',sans-serif;font-size:15px;color:var(--ink);
    background:var(--paper-raised);border:1px solid var(--rule);border-radius:3px;
    padding:11px 12px;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);}
  .field textarea{resize:vertical;min-height:80px;font-family:'Work Sans',sans-serif;}
  .field textarea[readonly]{background:var(--gold-soft);color:var(--ink);cursor:default;}
  .field .err{display:none;margin-top:5px;}
  .field.has-error input, .field.has-error select, .field.has-error textarea{border-color:var(--error);}
  .field.has-error .err{display:block;}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;}
  @media (max-width:480px){.row2,.row3{grid-template-columns:1fr;}}

  .option-cards{display:grid;gap:10px;}
  .option-card{border:1px solid var(--rule);border-radius:3px;padding:14px 16px;cursor:pointer;background:var(--paper-raised);}
  .option-card .oc-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .option-card .oc-title{font-family:'Fraunces',serif;font-size:16.5px;}
  .option-card .oc-price{font-size:14.5px;color:var(--gold);white-space:nowrap;}
  .option-card .oc-desc{font-size:13px;color:var(--ink-soft);margin-top:5px;line-height:1.5;}
  .option-card.selected{border-color:var(--gold);background:var(--gold-soft);}

  .yn-row{display:flex;gap:10px;}
  .yn-btn{flex:1;border:1px solid var(--rule);border-radius:3px;padding:14px;text-align:center;font-size:14px;line-height:1.5;background:var(--paper-raised);cursor:pointer;}
  .yn-btn.selected{border-color:var(--gold);background:var(--gold-soft);}
  .yn-btn.autoriza.selected{border-color:#5C7A52;background:#E7EEE1;}
  .yn-btn.naoautoriza.selected{border-color:var(--error);background:#F5E3E0;}

  .summary-table{border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--paper-raised);}
  .summary-table .li{display:flex;justify-content:space-between;padding:12px 16px;font-size:14.5px;border-bottom:1px solid var(--rule);}
  .summary-table .li:last-child{border-bottom:none;}
  .summary-table .total{font-family:'Fraunces',serif;font-size:19px;background:var(--gold-soft);}

  .contract-pane{border:1px solid var(--rule);border-radius:3px;background:var(--paper-raised);max-height:360px;overflow-y:auto;padding:18px;font-size:13px;line-height:1.65;}
  .contract-pane h3{font-family:'Fraunces',serif;font-size:14.5px;margin:18px 0 6px;}
  .contract-pane h3:first-child{margin-top:0;}
  .contract-pane p{margin:0 0 10px;color:var(--ink);}
  .scroll-hint{font-size:12px;color:var(--gold);margin-top:8px;}
  .scroll-hint.done{color:#5C7A52;}

  .declare-list{display:flex;flex-direction:column;gap:12px;}
  .declare-item{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.5;cursor:pointer;}
  .declare-item input{margin-top:3px;}

  .method-tabs{display:flex;gap:8px;margin-bottom:18px;}
  .method-tab{flex:1;text-align:center;padding:10px;border:1px solid var(--rule);border-radius:3px;font-size:13.5px;cursor:pointer;background:var(--paper-raised);}
  .method-tab.selected{border-color:var(--ink);background:var(--ink);color:var(--paper);}
  .method-panel{display:none;}
  .method-panel.active{display:block;}

  .canvas-wrap{position:relative;border-bottom:1.5px solid var(--ink);background:#FDFCF9;}
  #pad{display:block;width:100%;height:180px;touch-action:none;cursor:crosshair;}
  .placeholder{position:absolute;left:0;right:0;top:0;bottom:12px;display:flex;align-items:center;justify-content:center;font-family:'Caveat',cursive;font-size:24px;color:#C6BFAF;pointer-events:none;transition:opacity .15s ease;}
  .pad-actions{display:flex;gap:10px;margin-top:12px;}

  button{font-family:'Work Sans',sans-serif;cursor:pointer;border-radius:3px;transition:opacity .15s ease;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  .ghost-btn{background:transparent;border:1px solid var(--rule);color:var(--ink);font-size:13.5px;padding:9px 14px;}
  .ghost-btn:not(:disabled):hover{border-color:var(--ink-soft);}

  .nav-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:28px;padding-top:20px;border-top:1px solid var(--rule);}
  .nav-btn{padding:12px 20px;font-size:14px;border:none;}
  .btn-back{background:transparent;color:var(--ink-soft);}
  .btn-next{background:var(--ink);color:var(--paper);margin-left:auto;}
  .btn-next:not(:disabled):hover{opacity:.88;}

  .err{color:var(--error);font-size:12.5px;}

  .price-pill{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);
    padding:9px 18px;border-radius:20px;font-size:13px;box-shadow:0 8px 20px -6px rgba(0,0,0,.4);z-index:6;}
  .price-pill b{color:#F1D98A;margin-left:6px;}

  .success-box{text-align:center;padding:10px 0;}
  .success-box .check{font-size:38px;}
  .success-box dl{display:inline-grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;font-size:13.5px;margin-top:18px;}
  .success-box dt{color:var(--ink-soft);}
  .success-box dd{margin:0;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="row">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <rect x="2" y="7" width="20" height="14" rx="2" stroke="#221F1C" stroke-width="1.4"/>
        <path d="M8 7L9.6 4.4H14.4L16 7" stroke="#221F1C" stroke-width="1.4" stroke-linejoin="round"/>
        <circle cx="12" cy="14" r="4.2" stroke="#221F1C" stroke-width="1.4"/>
      </svg>
      <span class="wordmark"><strong>CIBELE MATOZO</strong> · contrato digital</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel"></div>
  </header>
  <main id="stepsContainer"></main>
</div>
<div class="price-pill" id="pricePill" hidden>Total <b id="pricePillValue"></b></div>

<script>
/* ============================================================
   BACKEND (Apps Script) — usado só para receber o contrato finalizado
   ============================================================ */
/* Cole aqui a URL do seu Web App do Apps Script (a mesma de sempre, .../exec).
   Esta página não abre mais essa URL diretamente — ela só faz uma chamada de
   fundo (fetch) para essa mesma URL quando o cliente finaliza a contratação. */
const APPS_SCRIPT_EXEC_URL = 'COLE_AQUI_A_URL_DO_SEU_APP_DA_WEB';

/* ============================================================
   DADOS DE PACOTES E PREÇOS
   ============================================================ */
const PACOTES = {
  digital:    {label:'Pacote Digital',          valor:1300, desc:'01 fotógrafo · ensaio pré-evento no local da festa · arquivos digitais em alta resolução via link · sem álbum.'},
  essencial:  {label:'Pacote Essencial',        valor:2400, desc:'01 fotógrafo · ensaio pré-evento no local da festa · álbum livro 40 páginas / 50 imagens · arquivos digitais em alta resolução.'},
  ensaio:     {label:'Ensaio Pré-Evento',       valor:400,  desc:'01 fotógrafo · ensaio em Curitiba ou até 15 km · arquivos digitais em alta resolução · sem álbum.'},
  premium:    {label:'Pacote Premium',          valor:3400, desc:'01 fotógrafo + 01 cinegrafista · ensaio pré-evento · álbum 40 páginas / 60 imagens · pendrive com vídeo em 4K.'},
  completo:   {label:'Pacote Completo',         valor:3000, desc:'01 fotógrafo + 01 cinegrafista · ensaio pré-evento no local · álbum 30 páginas / 50 imagens · vídeo em 4K via link.'},
  video1:     {label:'Vídeo — 01 cinegrafista', valor:1500, desc:'Cobertura em vídeo com 1 profissional. Condições de pagamento a combinar.'},
  video2:     {label:'Vídeo — 02 cinegrafistas',valor:2500, desc:'Cobertura em vídeo com 2 profissionais. Condições de pagamento a combinar.'},
  storymaker: {label:'Somente Storymaker',      valor:500,  desc:'25 a 30 stories + making of da criança aniversariante.'},
};
const STORYMAKER_ADICIONAL = 400;
const CATEGORIAS = {
  fotografia: {label:'Somente Fotografia',    pacotes:['digital','essencial','ensaio']},
  fotovideo:  {label:'Fotografia + Filmagem', pacotes:['premium','completo']},
  video:      {label:'Somente Filmagem',      pacotes:['video1','video2']},
  storymaker: {label:'Somente Storymaker',    pacotes:['storymaker']},
};

/* ============================================================
   ESTADO
   ============================================================ */
const state = {
  nome:'', cpf:'', rua:'', numero:'', complemento:'', bairro:'', cidade:'', uf:'',
  whatsapp:'', email:'',
  criancaNome:'', idade:'', dataAniversario:'', festaLocal:'',
  festaRua:'', festaNumero:'', festaBairro:'', festaCidade:'', festaUf:'',
  horarioInicio:'', horarioFim:'', infoEspecial:'',
  categoria:'', pacote:'', storymakerAdicional:null, modalidadeVideo:'',
  ensaioLocal:'', ensaioEndereco:'',
  formaPagamento:'', condicoesEspeciais:'', condicoesBloqueadas:false, observacoes:'',
  autorizacaoImagem:null,
  declaracoes:{d1:false,d2:false,d3:false,d4:false,d5:false,d6:false,d7:false},
  contratoLido:false,
  metodoAssinatura:'desenho',
  aceiteNome:'', aceiteNomeConfirma:'', aceiteDeclara:false,
  assinaturaPNG:null, temTraco:false,
};

/* ============================================================
   HELPERS
   ============================================================ */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatBRL(n){ return (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function formatDate(iso){ if(!iso) return '—'; const p=iso.split('-'); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : iso; }
function maskCPF(v){ v=v.replace(/\D/g,'').slice(0,11); v=v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2'); return v; }
function maskPhone(v){ v=v.replace(/\D/g,'').slice(0,11); if(v.length>10) v=v.replace(/(\d{2})(\d{5})(\d{4})/,'($1) $2-$3'); else v=v.replace(/(\d{2})(\d{4})(\d{0,4})/,'($1) $2-$3'); return v; }

function bindText(container, id, key, mask){
  const input = container.querySelector('#'+id);
  input.addEventListener('input', () => {
    let v = input.value;
    if (mask) { v = mask(v); input.value = v; }
    state[key] = v;
    const field = input.closest('.field'); if(field) field.classList.remove('has-error');
  });
}
function requireField(el,id,condition,msg){
  const input = el.querySelector('#'+id);
  const field = input.closest('.field');
  let err = field.querySelector('.err');
  if(!err){ err=document.createElement('div'); err.className='err'; field.appendChild(err); }
  if(!condition){ field.classList.add('has-error'); err.textContent = msg; return false; }
  field.classList.remove('has-error'); return true;
}
function showTopError(el,msg){
  let err = el.querySelector('.top-err');
  if(!err){
    err=document.createElement('div');
    err.className='err top-err';
    err.style.margin='14px 0 0';
    const navRow = el.querySelector('.nav-row');
    if(navRow) el.insertBefore(err, navRow); else el.appendChild(err);
  }
  err.textContent = msg;
}
function clearTopError(el){ const e=el.querySelector('.top-err'); if(e) e.remove(); }
function requireStepChoice(el, condition, msg){
  if(!condition){ showTopError(el,msg); return false; }
  clearTopError(el); return true;
}
function computeBreakdown(){
  const p = PACOTES[state.pacote];
  const items = [];
  if(p) items.push({label:p.label, valor:p.valor});
  if(state.categoria!=='storymaker' && state.storymakerAdicional) items.push({label:'Storymaker adicional', valor:STORYMAKER_ADICIONAL});
  const total = items.reduce((s,i)=>s+i.valor,0);
  return {items, total};
}
function pixCondicao(){
  if(state.pacote==='digital') return 'Pagamento em 2x: entrada para reserva da data + saldo até o dia do evento.';
  if(state.pacote==='essencial') return 'Pagamento em até 3x: entrada para reserva + parcela no dia do evento + parcela na entrega dos arquivos.';
  if(state.pacote==='premium' || state.pacote==='completo') return 'Parcelamento via PIX a combinar diretamente com a Cibele.';
  return 'Condições de pagamento a combinar diretamente com a Cibele.';
}
function ensaioLocalLabel(){
  if(state.ensaioLocal==='festa') return 'No local da festa';
  if(state.ensaioLocal==='curitiba') return 'Em Curitiba';
  if(state.ensaioLocal==='outro') return 'Outro local';
  return '—';
}

/* ============================================================
   TEXTO DO CONTRATO (usado na leitura em tela e enviado ao backend)
   ============================================================ */
function buildClauses(){
  const enderecoContratante = `Rua ${state.rua}, nº ${state.numero}${state.complemento?(', '+state.complemento):''} — ${state.bairro}, ${state.cidade}/${state.uf}`;
  const {items,total} = computeBreakdown();
  const itemsTxt = items.map(i=>`${i.label} — ${formatBRL(i.valor)}`).join('\n');
  const temVideo = state.categoria==='fotovideo' || state.categoria==='video';
  const videoTxt = temVideo
    ? (state.modalidadeVideo==='shortfilm'
        ? 'SHORT FILM – MELHORES MOMENTOS: vídeo editado com os principais momentos do evento, com duração de até 30 minutos.'
        : 'EVENTO NA ÍNTEGRA: material contendo os momentos registrados durante o evento, organizados e editados, buscando contemplar a totalidade dos momentos relevantes registrados pela equipe.')
    : 'Não aplicável ao pacote contratado.';
  const imagemTxt = state.autorizacaoImagem==='autorizo'
    ? 'AUTORIZO a utilização para portfólio, redes sociais, site, publicidade e materiais promocionais da Cibele Matozo Fotografia.'
    : 'NÃO AUTORIZO a utilização para essas finalidades.';

  return [
    {t:'QUALIFICAÇÃO DAS PARTES', b:`CONTRATADA: Cibele Matozo Fotografia, representada pela Sra. Cibele Matozo de Lara, CPF nº 066.877.109-74, residente e domiciliada à Rua Dilermando Pereira de Almeida, nº 394, Pinheirinho, Curitiba, Paraná, e-mail cibelematozofotografia@gmail.com, WhatsApp (41) 99602-5409, doravante denominada CONTRATADA.\n\nCONTRATANTE: ${state.nome}, CPF nº ${state.cpf}, residente e domiciliado(a) à ${enderecoContratante}, WhatsApp ${state.whatsapp}, e-mail ${state.email}, doravante denominado(a) CONTRATANTE.`},
    {t:'CLÁUSULA 1ª – DO OBJETO DO CONTRATO', b:`O presente contrato tem por objeto a prestação de serviços profissionais de fotografia e/ou filmagem para aniversário infantil, de acordo com o pacote e os serviços adicionais escolhidos pelo CONTRATANTE.\n\nNome da criança: ${state.criancaNome}\nData: ${formatDate(state.dataAniversario)}   Horário: ${state.horarioInicio||'—'} às ${state.horarioFim||'—'}\nLocal: ${state.festaLocal}\nEndereço: ${state.festaRua}, ${state.festaNumero} — ${state.festaBairro}, ${state.festaCidade}/${state.festaUf}`},
    {t:'CLÁUSULA 2ª – DOS PACOTES E SERVIÇOS DISPONÍVEIS', b:`SOMENTE FOTOGRAFIA\nPacote Digital — R$ 1.300,00: 01 fotógrafo; ensaio pré-evento no local da festa; arquivos digitais editados em alta resolução via link; sem álbum.\nPacote Essencial — R$ 2.400,00: 01 fotógrafo; ensaio pré-evento no local da festa; álbum livro 40 páginas / 50 imagens; arquivos digitais editados em alta resolução via link.\nEnsaio Pré-Evento — R$ 400,00: 01 fotógrafo; ensaio em Curitiba ou até 15 km de distância; arquivos digitais editados em alta resolução via link; sem álbum.\n\nFOTOGRAFIA E FILMAGEM\nPacote Premium — R$ 3.400,00: 01 fotógrafo; 01 cinegrafista; ensaio pré-evento em Curitiba ou até 15 km; ensaio pré-evento no local da festa; álbum livro 40 páginas / 60 imagens; pendrive com arquivos editados e vídeo em 4K; arquivos editados em alta resolução via link.\nPacote Completo — R$ 3.000,00: 01 fotógrafo; 01 cinegrafista; ensaio pré-evento no local da festa; álbum livro 30 páginas / 50 imagens; arquivos editados em alta resolução e vídeo em 4K via link.\n\nSOMENTE VÍDEO: 01 cinegrafista — R$ 1.500,00; 02 cinegrafistas — R$ 2.500,00. Condições de pagamento a combinar.\n\nSTORYMAKER: com vídeo — R$ 400,00, 25 a 30 stories; somente Storymaker — R$ 500,00, 25 a 30 stories + making of da criança aniversariante.`},
    {t:'CLÁUSULA 3ª – DA ESCOLHA DO PACOTE E DOS SERVIÇOS', b:`Pacote e serviços selecionados:\n${itemsTxt}\n\nValor total contratado: ${formatBRL(total)}`},
    {t:'CLÁUSULA 4ª – DA COBERTURA DO EVENTO', b:`A cobertura do evento será realizada conforme o pacote contratado e durante o período previamente acordado entre as partes.\n\nA expressão "cobertura completa do evento", quando utilizada na descrição de determinado pacote, refere-se à cobertura realizada durante o período contratado, não representando obrigação de registro contínuo e ininterrupto de todos os segundos do evento.\n\nAtrasos decorrentes de responsabilidade do CONTRATANTE, convidados, familiares, cerimonial, buffet, espaço de eventos, fornecedores ou terceiros não implicarão automaticamente na extensão do período contratado. Horas adicionais poderão ser contratadas mediante disponibilidade e pagamento correspondente.`},
    {t:'CLÁUSULA 5ª – DO VALOR E DAS CONDIÇÕES DE PAGAMENTO', b:`O valor total será aquele indicado na Cláusula 3ª, podendo ser alterado mediante negociação expressamente registrada neste contrato.\n\nCartão de crédito: até 10x, com taxas da operadora sob responsabilidade do CONTRATANTE.\n\nPIX: Digital em 2x (entrada para reserva + saldo até o evento); Essencial em até 3x (entrada + parcela no dia do evento + parcela na entrega); Premium e Completo via PIX a combinar. Vídeo: condições a combinar.\n\nForma escolhida: ${state.formaPagamento==='pix'?'PIX':'Cartão de crédito'}${state.condicoesEspeciais?('\nCondição registrada: '+state.condicoesEspeciais):''}`},
    {t:'CLÁUSULA 6ª – DA RESERVA DA DATA', b:`A data somente será considerada efetivamente reservada após a confirmação do pagamento da entrada ou do valor estabelecido para reserva. Enquanto não houver confirmação, a data poderá ser disponibilizada para outros interessados.`},
    {t:'CLÁUSULA 7ª – DO CANCELAMENTO, DESISTÊNCIA E REEMBOLSO', b:`O cancelamento deverá ser solicitado por escrito, preferencialmente por WhatsApp ou e-mail. Quando aplicável, será observado o direito de arrependimento previsto na legislação de proteção ao consumidor.\n\nCancelamento com antecedência igual ou superior a 60 dias: restituição de 80% dos valores pagos, com retenção de 20% pela reserva da data e custos administrativos. Entre 30 e 59 dias: restituição de 50%. Inferior a 30 dias: restituição de 20%, sem prejuízo da análise de custos comprovadamente realizados e não recuperáveis.\n\nEm caso de cancelamento imputável à CONTRATADA, sem substituição por profissional compatível ou nova data acordada, serão restituídos os valores correspondentes aos serviços não prestados, observada a legislação aplicável.`},
    {t:'CLÁUSULA 8ª – DA REMARCAÇÃO DO EVENTO', b:`A remarcação dependerá de comunicação prévia e disponibilidade da agenda da CONTRATADA. Havendo disponibilidade, os valores pagos poderão ser aproveitados para a nova data. Em caso de caso fortuito ou força maior, as partes buscarão de boa-fé a realização do serviço em nova data.`},
    {t:'CLÁUSULA 9ª – DOS PRAZOS E DA ENTREGA DOS ARQUIVOS', b:`As fotografias serão entregues após seleção, tratamento e edição. Os arquivos digitais serão disponibilizados por link ou plataforma indicada pela CONTRATADA.\n\nOs prazos poderão ser prorrogados quando houver atraso do CONTRATANTE em seleção, aprovação, fornecimento de informações ou outra etapa sob sua responsabilidade.`},

    {t:'CLÁUSULA 19ª – DA EQUIPE E SUBSTITUIÇÃO DE PROFISSIONAIS', b:`Em situações excepcionais, a CONTRATADA poderá substituir fotógrafo, cinegrafista, Storymaker ou outro profissional por pessoa de qualificação compatível, especialmente em casos de doença, acidente, emergência, impedimento, caso fortuito ou força maior.`},
    {t:'CLÁUSULA 20ª – DE FALHAS TÉCNICAS E PERDA DE MATERIAL', b:`A CONTRATADA adotará procedimentos técnicos e medidas razoáveis para preservação dos arquivos. Em caso de falha técnica imprevisível, defeito, corrupção de arquivos ou outro evento alheio à sua vontade, serão adotadas medidas tecnicamente possíveis para recuperação.`},

/* ============================================================
   ETAPAS
   ============================================================ */
const STEPS = [
  {id:'intro',        render:renderIntro,        validate:()=>true},
  {id:'contratante',  render:renderContratante,   validate:validateContratante},
  {id:'crianca',      render:renderCrianca,       validate:validateCrianca},
  {id:'categoria',    render:renderCategoria,     validate:(el)=>requireStepChoice(el, !!state.categoria, 'Escolha uma opção para continuar.')},
  {id:'pacote',       render:renderPacote,        validate:(el)=>requireStepChoice(el, !!state.pacote, 'Escolha um pacote para continuar.')},
  {id:'storymakerAdd',render:renderStorymakerAdd, validate:(el)=>requireStepChoice(el, state.storymakerAdicional!==null, 'Escolha uma opção.'),
    active:()=> state.categoria !== 'storymaker'},
  {id:'modalidadeVideo', render:renderModalidadeVideo, validate:(el)=>requireStepChoice(el, !!state.modalidadeVideo, 'Escolha uma modalidade.'),
    active:()=> state.categoria==='fotovideo' || state.categoria==='video'},
  {id:'ensaio',       render:renderEnsaio,        validate:validateEnsaio,
    active:()=> state.categoria==='fotografia' || state.categoria==='fotovideo'},
  {id:'resumo',       render:renderResumo,        validate:()=>true},
  {id:'pagamento',    render:renderPagamento,     validate:(el)=>requireStepChoice(el, !!state.formaPagamento, 'Escolha uma forma de pagamento.')},
  {id:'observacoes',  render:renderObservacoes,   validate:()=>true},
  {id:'imagem',       render:renderImagem,        validate:(el)=>requireStepChoice(el, !!state.autorizacaoImagem, 'Escolha AUTORIZO ou NÃO AUTORIZO para continuar.')},
  {id:'contrato',     render:renderContrato,      validate:(el)=>{ if(!state.contratoLido){ showTopError(el,'Role o contrato até o final antes de continuar.'); return false;} clearTopError(el); return true; }},
  {id:'declaracoes',  render:renderDeclaracoes,   validate:(el)=>{ const ok=Object.values(state.declaracoes).every(Boolean); if(!ok) showTopError(el,'Marque todas as declarações para continuar.'); else clearTopError(el); return ok; }},
  {id:'assinatura',   render:renderAssinatura,    validate:validateAssinatura},
  {id:'final',        render:renderFinal,         validate:()=>true},
];
STEPS.forEach(s=>{ if(!s.active) s.active=()=>true; });

let currentIndex = 0;
function activeSteps(){ return STEPS.filter(s=>s.active()); }

/* Lê a condição especial pré-definida pela Cibele, se o link tiver "?cond=...".
   Como esta página roda no próprio domínio (não mais dentro do Apps Script),
   basta ler a URL diretamente — sem truques de sandbox de iframe. */
(function initPreset(){
  const raw = new URLSearchParams(window.location.search).get('cond') || '';
  if (raw.trim().length > 0) {
    state.condicoesEspeciais = raw;
    state.condicoesBloqueadas = true;
  }
})();

function renderCategoria(el){

          <div class="oc-row"><span class="oc-title">${c.label}</span></div>
        </div>`).join('')}
    </div>
  `;
  el.querySelectorAll('.option-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      const k = card.dataset.k;
      if(state.categoria !== k){ state.categoria = k; state.pacote=''; }
      el.querySelectorAll('.option-card').forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');
      clearTopError(el);
      updatePricePill();
    });
  });

  if(state.metodoAssinatura==='desenho'){
    if(!state.temTraco){ showTopError(el,'Desenhe sua assinatura antes de continuar.'); return false; }
  } else {

    ok = requireField(el,'f_aceiteNomeConfirma', state.aceiteNomeConfirma.trim().length>2 && state.aceiteNomeConfirma.trim().toLowerCase()===state.aceiteNome.trim().toLowerCase(), 'Os nomes digitados não coincidem.') && ok;

  }

function initSignaturePad(container){
  const canvas = container.querySelector('#pad');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const placeholder = container.querySelector('#placeholder');
  const undoBtn = container.querySelector('#undoBtn');
  const clearBtn = container.querySelector('#clearBtn');
  let strokes = [];
  let currentStroke = null;
  let drawing = false;

  function resizeCanvas(){
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(rect.width*dpr);
    canvas.height = Math.round(rect.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    redraw();
  }
  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    return {x:e.clientX-rect.left, y:e.clientY-rect.top};
  }
  function redraw(){
    const rect = canvas.getBoundingClientRect();
    ctx.clearRect(0,0,rect.width,rect.height);
    ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=2.4; ctx.strokeStyle='#221F1C';
    strokes.forEach(stroke=>{
      if(stroke.length<2) return;
      ctx.beginPath(); ctx.moveTo(stroke[0].x, stroke[0].y);
      for(let i=1;i<stroke.length-1;i++){
        const mx=(stroke[i].x+stroke[i+1].x)/2, my=(stroke[i].y+stroke[i+1].y)/2;
        ctx.quadraticCurveTo(stroke[i].x, stroke[i].y, mx, my);
      }
      ctx.stroke();
    });
    refresh();
  }
  function hasInk(){ return strokes.some(s=>s.length>1); }
  function refresh(){
    placeholder.style.opacity = hasInk() ? '0':'1';
    undoBtn.disabled = strokes.length===0;
    clearBtn.disabled = strokes.length===0;
    state.temTraco = hasInk();
    state.assinaturaPNG = hasInk() ? canvas.toDataURL('image/png') : null;
  }
  canvas.addEventListener('pointerdown', e=>{
    drawing=true; canvas.setPointerCapture(e.pointerId);
    currentStroke=[getPos(e)]; strokes.push(currentStroke);
  });
  canvas.addEventListener('pointermove', e=>{ if(!drawing) return; currentStroke.push(getPos(e)); redraw(); });
  function end(){ if(!drawing) return; drawing=false; currentStroke=null; refresh(); }
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('pointerleave', ()=>{ if(drawing) end(); });
  clearBtn.addEventListener('click', ()=>{ strokes=[]; redraw(); });
  undoBtn.addEventListener('click', ()=>{ strokes.pop(); redraw(); });
  window.addEventListener('resize', ()=>{ clearTimeout(window.__rtSig); window.__rtSig=setTimeout(resizeCanvas,150); });
  resizeCanvas();
}

function buildPayload(){
  const {total} = computeBreakdown();
  return {
    nome:state.nome, cpf:state.cpf, whatsapp:state.whatsapp, email:state.email,
    endereco:`Rua ${state.rua}, nº ${state.numero}${state.complemento?(', '+state.complemento):''} — ${state.bairro}, ${state.cidade}/${state.uf}`,
    criancaNome:state.criancaNome, dataAniversario: formatDate(state.dataAniversario),
    pacoteLabel: PACOTES[state.pacote]?PACOTES[state.pacote].label:'',
    valorPacote: PACOTES[state.pacote]?PACOTES[state.pacote].valor:0,
    storymakerAdicional: !!(state.categoria!=='storymaker' && state.storymakerAdicional),
    total: total, formaPagamento: state.formaPagamento==='pix'?'PIX':'Cartão de crédito',
    autorizacaoImagem: state.autorizacaoImagem,
    metodoAssinatura: state.metodoAssinatura,
    aceiteNome: state.aceiteNome, aceiteCpf: state.cpf,
    assinaturaPNG: state.assinaturaPNG,
    clausulas: (window.__lastClauses || buildClauses()).map(c=>({titulo:c.t, texto:c.b})),
  };
}
function isBackendConfigurado(){
  return APPS_SCRIPT_EXEC_URL && APPS_SCRIPT_EXEC_URL.indexOf('COLE_AQUI') !== 0;
}

function onSubmit(){
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Enviando…';
  const payload = buildPayload();

  if (!isBackendConfigurado()) {
    // Modo demonstração — nenhuma URL de backend configurada ainda.
    setTimeout(() => {
      const protocolo = 'CMF-' + new Date().getFullYear() + '-DEMO' + Math.floor(Math.random()*900+100);
      showResult(protocolo, null, true);
    }, 700);
    return;
  }

  fetch(APPS_SCRIPT_EXEC_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita pre-flight de CORS
    body: JSON.stringify(payload)
  })
    .then(r => r.json())
    .then(res => showResult(res && res.ok ? res.protocolo : null, res && res.error))
    .catch(err => showResult(null, String(err)));
}
function showResult(protocolo, error, isDemo){
  const box = document.getElementById('finalResult');
  const btn = document.getElementById('submitBtn');
  if(protocolo){
    btn.style.display='none';
    box.innerHTML = `
      <div class="success-box">
        <div class="check">✓</div>
        <h2>Contrato assinado com sucesso!</h2>
        <p class="step-sub" style="margin:0 auto;">${isDemo? 'Modo demonstração — nenhum e-mail foi enviado. Depois de configurar o endereço do backend (APPS_SCRIPT_EXEC_URL), este passo grava a planilha, gera o PDF e envia por e-mail de verdade.' : 'Você receberá uma cópia por e-mail. A Cibele também foi notificada.'}</p>
        <dl>
          <dt>Protocolo</dt><dd>${esc(protocolo)}</dd>
          <dt>Data/hora</dt><dd>${new Date().toLocaleString('pt-BR')}</dd>
          <dt>Valor</dt><dd>${formatBRL(computeBreakdown().total)}</dd>
        </dl>
      </div>`;
  } else {
    btn.disabled=false; btn.textContent='Finalizar contratação';
    box.innerHTML = `<p class="err">Não foi possível concluir agora. ${esc(error||'')} Tente novamente em instantes.</p>`;
  }
}

/* ============================================================
   NAVEGAÇÃO
   ============================================================ */
function goToStep(idx){
  const steps = activeSteps();
  currentIndex = Math.max(0, Math.min(idx, steps.length-1));
  renderCurrentStep();
}
function renderCurrentStep(){
  const steps = activeSteps();
  const step = steps[currentIndex];
  const container = document.getElementById('stepsContainer');
  container.innerHTML = '<div class="step" id="stepBody"></div>';
  const body = document.getElementById('stepBody');
  step.render(body);

  const nav = document.createElement('div');
  nav.className='nav-row';
  nav.innerHTML = `
    ${currentIndex>0 ? '<button class="nav-btn btn-back" id="backBtn">Voltar</button>' : '<span></span>'}
    ${step.id!=='final' ? `<button class="nav-btn btn-next" id="nextBtn">${step.id==='intro'?'Começar':'Avançar'}</button>` : ''}
  `;
  body.appendChild(nav);
  if(currentIndex>0) document.getElementById('backBtn').addEventListener('click', ()=>goToStep(currentIndex-1));
  if(step.id!=='final'){
    document.getElementById('nextBtn').addEventListener('click', ()=>{
      if(step.validate(body)) goToStep(currentIndex+1);
    });
  }
  updateProgress();
  updatePricePill();
  window.scrollTo(0,0);
}
function updateProgress(){
  const steps = activeSteps();
  const pct = steps.length>1 ? Math.round((currentIndex/(steps.length-1))*100) : 0;
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressLabel').textContent = `Etapa ${currentIndex+1} de ${steps.length}`;
}
function updatePricePill(){
  const pill = document.getElementById('pricePill');
  const steps = activeSteps();
  const step = steps[currentIndex];
  const showFromIdx = STEPS.findIndex(s=>s.id==='resumo');
  const currentAllIdx = STEPS.findIndex(s=>s.id===step.id);
  if(state.pacote && currentAllIdx>=showFromIdx && step.id!=='final'){
    pill.hidden=false;
    document.getElementById('pricePillValue').textContent = formatBRL(computeBreakdown().total);
  } else {
    pill.hidden=true;
  }
}

goToStep(0);
