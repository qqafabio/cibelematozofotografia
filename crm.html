<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM — Cibele Matozo Fotografia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF9F4; --paper-raised:#FFFFFF; --ink:#221F1C; --ink-soft:#6B6459;
    --rule:#DCD4C4; --gold:#A8791E; --gold-soft:#F1E6CC; --error:#B23B2E; --ok:#5C7A52; --ok-soft:#E7EEE1;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Work Sans',sans-serif;-webkit-font-smoothing:antialiased;}
  .shell{display:flex;min-height:100vh;}

  /* ---- Sidebar ---- */
  .sidebar{width:220px;flex-shrink:0;background:var(--paper-raised);border-right:1px solid var(--rule);padding:20px 14px;}
  .brand{display:flex;align-items:center;gap:9px;padding:0 6px 18px;border-bottom:1px solid var(--rule);margin-bottom:16px;}
  .brand .wordmark{font-size:12px;letter-spacing:.08em;color:var(--ink-soft);line-height:1.3;}
  .brand .wordmark strong{display:block;color:var(--ink);font-size:12.5px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:3px;font-size:14px;cursor:pointer;color:var(--ink);margin-bottom:2px;}
  .nav-item:hover{background:var(--gold-soft);}
  .nav-item.active{background:var(--ink);color:var(--paper);}
  .nav-item.disabled{color:#B7B2A6;cursor:default;}
  .nav-item.disabled:hover{background:none;}
  .nav-soon{font-size:10px;background:var(--rule);color:var(--ink-soft);padding:1px 6px;border-radius:8px;margin-left:auto;}

  /* ---- Main ---- */
  .main{flex:1;min-width:0;padding:28px 32px 60px;}
  .view-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .view-header h1{font-family:'Fraunces',serif;font-weight:500;font-size:26px;margin:0;}
  .view-header p{color:var(--ink-soft);font-size:13.5px;margin:4px 0 0;}

  button{font-family:'Work Sans',sans-serif;cursor:pointer;border-radius:3px;border:none;transition:opacity .15s ease;}
  .btn-primary{background:var(--ink);color:var(--paper);padding:10px 16px;font-size:13.5px;}
  .btn-primary:hover{opacity:.88;}
  .btn-ghost{background:transparent;border:1px solid var(--rule);color:var(--ink);padding:9px 14px;font-size:13.5px;}
  .btn-ghost:hover{border-color:var(--ink-soft);}
  .btn-danger{background:transparent;border:1px solid var(--error);color:var(--error);padding:9px 14px;font-size:13.5px;margin-right:auto;}
  .btn-danger:hover{background:var(--error);color:var(--paper);}

  /* ---- KPI cards ---- */
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:28px;}
  .kpi-card{background:var(--paper-raised);border:1px solid var(--rule);border-radius:3px;padding:16px 18px;}
  .kpi-card .kpi-label{font-size:12px;color:var(--ink-soft);}
  .kpi-card .kpi-value{font-family:'Fraunces',serif;font-size:26px;margin-top:4px;}

  .panel{background:var(--paper-raised);border:1px solid var(--rule);border-radius:3px;}
  .panel h2{font-family:'Fraunces',serif;font-weight:500;font-size:16px;margin:0;padding:14px 18px;border-bottom:1px solid var(--rule);}

  /* ---- Tables ---- */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-weight:500;color:var(--ink-soft);font-size:11.5px;letter-spacing:.03em;padding:10px 16px;border-bottom:1px solid var(--rule);}
  td{padding:11px 16px;border-bottom:1px solid var(--rule);}
  tr:last-child td{border-bottom:none;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover{background:var(--gold-soft);}
  .status-pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:10px;background:var(--gold-soft);color:#6B5316;}
  .status-pill.confirmado{background:var(--ok-soft);color:#3E5636;}

  .empty-state{padding:40px 20px;text-align:center;color:var(--ink-soft);font-size:13.5px;}

  /* ---- Search ---- */
  .search-box{margin-bottom:16px;}
  .search-box input{width:100%;max-width:320px;font-size:14px;padding:10px 12px;border:1px solid var(--rule);border-radius:3px;background:var(--paper-raised);}

  /* ---- Form panel (create/edit) ---- */
  .form-overlay{position:fixed;inset:0;background:rgba(34,31,28,.35);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;z-index:20;}
  .form-panel{background:var(--paper-raised);border-radius:4px;width:100%;max-width:560px;padding:26px 28px 24px;}
  .form-panel h2{font-family:'Fraunces',serif;font-weight:500;font-size:19px;margin:0 0 18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;font-size:14px;padding:9px 11px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);font-family:'Work Sans',sans-serif;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--rule);}
  .form-err{color:var(--error);font-size:12.5px;margin-bottom:12px;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:20px;font-size:13px;z-index:30;}
  .loading-note{color:var(--ink-soft);font-size:13px;padding:20px 0;}

  /* ---- Modal Flutuante (Task 2.1) ---- */
  .floating-window-overlay{position:fixed;inset:0;background:rgba(34,31,28,.35);z-index:19;}
  .floating-window{position:fixed;background:var(--paper-raised);border:1px solid var(--rule);border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.15);min-width:400px;min-height:300px;display:flex;flex-direction:column;z-index:20;}
  .floating-window-header{background:linear-gradient(135deg,var(--gold) 0%,var(--ink-soft) 100%);color:white;padding:12px 16px;cursor:move;font-weight:500;border-bottom:1px solid var(--rule);flex-shrink:0;user-select:none;display:flex;justify-content:space-between;align-items:center;}
  .floating-window-header .close-btn{background:rgba(255,255,255,.2);border:none;color:white;cursor:pointer;padding:4px 8px;border-radius:2px;font-size:14px;}
  .floating-window-header .close-btn:hover{background:rgba(255,255,255,.4);}
  .floating-window-content{overflow-y:auto;padding:20px;flex:1;}
  .floating-window-resize{position:absolute;bottom:0;right:0;width:16px;height:16px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 0%,var(--gold) 100%);border-radius:0 0 4px 0;}

  /* ---- Dashboard de Cobranças (Task 2.2) ---- */
  .urgency-critica{background:var(--error);color:white;}
  .urgency-alta{background:#ff9800;color:white;}
  .urgency-media{background:#ffc107;color:var(--ink);}
  .urgency-baixa{background:var(--ok);color:white;}
  .urgency-badge{display:inline-block;padding:3px 8px;border-radius:3px;font-size:11px;font-weight:500;}

  /* ---- Mobile topbar / gaveta de navegação ---- */
  .mobile-topbar{display:none;align-items:center;gap:12px;padding:12px 16px;background:var(--paper-raised);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:25;}
  .nav-toggle{background:none;border:none;font-size:22px;line-height:1;padding:4px 6px;color:var(--ink);}
  .mobile-topbar-title{font-size:12.5px;letter-spacing:.05em;color:var(--ink-soft);}
  .nav-backdrop{display:none;position:fixed;inset:0;background:rgba(34,31,28,.4);z-index:35;}
  .nav-backdrop.open{display:block;}

  @media (max-width:768px){
    .mobile-topbar{display:flex;}
    .sidebar{position:fixed;top:0;left:0;height:100vh;width:240px;max-width:80vw;transform:translateX(-100%);transition:transform .2s ease;z-index:40;overflow-y:auto;}
    .sidebar.open{transform:translateX(0);}
    .main{padding:20px 16px 60px;}
    .view-header{flex-direction:column;align-items:stretch;}
    .view-header .btn-primary{width:100%;}

    /* formulários em coluna única, ocupando a tela cheia */
    .row2,.row3{grid-template-columns:1fr;}
    .form-overlay{padding:0;align-items:stretch;}
    .form-panel{max-width:100%;min-height:100vh;border-radius:0;padding:20px 18px 90px;}
    .form-actions{flex-direction:column;}
    .form-actions button{width:100%;}
    .btn-danger{margin-right:0;}

    /* Mobile: floating window desabilitado */
    .floating-window{position:static !important;width:100vw;min-width:unset;max-width:100%;min-height:100vh;margin:0;border:none;border-radius:0;}
    .floating-window-resize{display:none;}

    /* tabelas viram cartões empilhados */
    table.responsive-table thead{display:none;}
    table.responsive-table, table.responsive-table tbody, table.responsive-table tr, table.responsive-table td{display:block;width:100%;}
    table.responsive-table tr{border:1px solid var(--rule);border-radius:4px;margin-bottom:12px;padding:4px 0;}
    table.responsive-table td{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;text-align:right;border-bottom:1px dashed var(--rule);}
    table.responsive-table td:last-child{border-bottom:none;}
    table.responsive-table td::before{content:attr(data-label);font-size:11.5px;color:var(--ink-soft);font-weight:500;text-align:left;}
  }
</style>
</head>
<body>
<div class="mobile-topbar">
  <button class="nav-toggle" id="navToggle" aria-label="Abrir menu">☰</button>
  <span class="mobile-topbar-title">CIBELE MATOZO · CRM</span>
</div>
<div class="nav-backdrop" id="navBackdrop"></div>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <rect x="2" y="7" width="20" height="14" rx="2" stroke="#221F1C" stroke-width="1.4"/>
        <path d="M8 7L9.6 4.4H14.4L16 7" stroke="#221F1C" stroke-width="1.4" stroke-linejoin="round"/>
        <circle cx="12" cy="14" r="4.2" stroke="#221F1C" stroke-width="1.4"/>
      </svg>
      <span class="wordmark"><strong>CIBELE MATOZO</strong>CRM</span>
    </div>
    <div id="navList"></div>
  </aside>
  <main class="main" id="mainArea"></main>
</div>
<div id="overlayRoot"></div>
<div id="toastRoot"></div>

<script>
/* ============ CONFIGURAÇÃO ============ */
const CRM_API_URL = 'https://script.google.com/macros/s/AKfycbyFy5w3fdEQ6t4lwVPMzpIiiN0CxCWu5tIqFTDGa4x_o3F9VtZKDXScaKY-HusEIpLx/exec';
 
/* ============ NAVEGAÇÃO ============ */
const NAV = [
  { id:'dashboard', label:'Dashboard', ready:true },
  { id:'clientes', label:'Clientes', ready:true },
  { id:'eventos', label:'Eventos · Agenda', ready:true },
  { id:'leads', label:'CRM · Orçamentos', ready:true },
  { id:'financeiro', label:'Financeiro', ready:true },
  { id:'contasEmAtraso', label:'📧 Cobranças', ready:true },
  { id:'dashboardCobrancas', label:'📊 Análise', ready:true },
  { id:'producao', label:'Produção', ready:true },
  { id:'custos', label:'Custos', ready:true },
  { id:'templates', label:'⚙️ Templates', ready:true },
  { id:'freelance', label:'Freelance', ready:true },
];
let currentView = 'dashboard';
let clientes = [];
let eventos = [];
let leads = [];
let financeiro = [];
let contasEmAtraso = [];
let producao = [];
let custos = [];
let templates = [];
let listas = {};
let freelanceEventos = [];
let dashboardCobrancas = null;
let loaded = false;

/* ============ FLOATING WINDOW (Task 2.1) ============ */
let currentFloatingWindow = null;

class FloatingWindow {
  constructor(id, options = {}) {
    this.id = id;
    this.element = null;
    this.header = null;
    this.content = null;
    this.isDragging = false;
    this.isResizing = false;
    this.startX = 0;
    this.startY = 0;
    this.startLeft = 0;
    this.startTop = 0;
    this.startWidth = 0;
    this.startHeight = 0;
    this.options = {
      minWidth: 400,
      minHeight: 300,
      maxZIndex: 100,
      saveName: null,
      ...options
    };
    this.zIndex = 20;
  }

  create(title, htmlContent) {
    const overlay = document.createElement('div');
    overlay.className = 'floating-window-overlay';
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) this.close();
    });

    this.element = document.createElement('div');
    this.element.className = 'floating-window';
    this.element.id = this.id;

    this.header = document.createElement('div');
    this.header.className = 'floating-window-header';
    this.header.innerHTML = `<span>${title}</span><button class="close-btn">×</button>`;
    this.header.querySelector('.close-btn').addEventListener('click', () => this.close());

    this.content = document.createElement('div');
    this.content.className = 'floating-window-content';
    this.content.innerHTML = htmlContent;

    const resizeHandle = document.createElement('div');
    resizeHandle.className = 'floating-window-resize';

    this.element.appendChild(this.header);
    this.element.appendChild(this.content);
    this.element.appendChild(resizeHandle);

    document.getElementById('overlayRoot').appendChild(overlay);
    document.getElementById('overlayRoot').appendChild(this.element);

    this.setupDragAndResize();
    this.restorePosition();
    this.makeActive();
    currentFloatingWindow = this;

    return this;
  }

  setupDragAndResize() {
    this.header.addEventListener('mousedown', (e) => this.startDrag(e));
    this.element.querySelector('.floating-window-resize').addEventListener('mousedown', (e) => this.startResize(e));
  }

  startDrag(e) {
    if (e.button !== 0) return;
    this.isDragging = true;
    this.startX = e.clientX;
    this.startY = e.clientY;
    this.startLeft = this.element.offsetLeft;
    this.startTop = this.element.offsetTop;
    document.addEventListener('mousemove', this.dragHandler = (e) => this.drag(e));
    document.addEventListener('mouseup', this.dragEndHandler = () => this.endDrag());
    e.preventDefault();
  }

  drag(e) {
    if (!this.isDragging) return;
    const dx = e.clientX - this.startX;
    const dy = e.clientY - this.startY;
    let newLeft = this.startLeft + dx;
    let newTop = this.startTop + dy;

    const maxLeft = window.innerWidth - this.element.offsetWidth;
    const maxTop = window.innerHeight - this.element.offsetHeight;

    newLeft = Math.max(0, Math.min(newLeft, maxLeft));
    newTop = Math.max(0, Math.min(newTop, maxTop));

    this.element.style.left = newLeft + 'px';
    this.element.style.top = newTop + 'px';
  }

  endDrag() {
    this.isDragging = false;
    document.removeEventListener('mousemove', this.dragHandler);
    document.removeEventListener('mouseup', this.dragEndHandler);
    this.savePosition();
  }

  startResize(e) {
    if (e.button !== 0) return;
    this.isResizing = true;
    this.startX = e.clientX;
    this.startY = e.clientY;
    this.startWidth = this.element.offsetWidth;
    this.startHeight = this.element.offsetHeight;
    document.addEventListener('mousemove', this.resizeHandler = (e) => this.resize(e));
    document.addEventListener('mouseup', this.resizeEndHandler = () => this.endResize());
    e.preventDefault();
  }

  resize(e) {
    if (!this.isResizing) return;
    const dx = e.clientX - this.startX;
    const dy = e.clientY - this.startY;
    let newWidth = Math.max(this.options.minWidth, this.startWidth + dx);
    let newHeight = Math.max(this.options.minHeight, this.startHeight + dy);

    this.element.style.width = newWidth + 'px';
    this.element.style.height = newHeight + 'px';
  }

  endResize() {
    this.isResizing = false;
    document.removeEventListener('mousemove', this.resizeHandler);
    document.removeEventListener('mouseup', this.resizeEndHandler);
    this.savePosition();
  }

  makeActive() {
    this.zIndex = Math.min(this.options.maxZIndex, Math.max(...document.querySelectorAll('.floating-window').map(el => parseInt(getComputedStyle(el).zIndex) || 0)) + 1);
    this.element.style.zIndex = this.zIndex;
  }

  savePosition() {
    if (!this.options.saveName) return;
    const pos = {
      left: this.element.offsetLeft,
      top: this.element.offsetTop,
      width: this.element.offsetWidth,
      height: this.element.offsetHeight
    };
    localStorage.setItem(`floatingWindow_${this.options.saveName}`, JSON.stringify(pos));
  }

  restorePosition() {
    if (!this.options.saveName) {
      this.center();
      return;
    }
    const saved = localStorage.getItem(`floatingWindow_${this.options.saveName}`);
    if (saved) {
      try {
        const pos = JSON.parse(saved);
        this.element.style.left = Math.max(0, pos.left) + 'px';
        this.element.style.top = Math.max(0, pos.top) + 'px';
        this.element.style.width = pos.width + 'px';
        this.element.style.height = pos.height + 'px';
      } catch (e) {
        this.center();
      }
    } else {
      this.center();
    }
  }

  center() {
    const w = Math.min(600, window.innerWidth - 40);
    const h = Math.min(500, window.innerHeight - 80);
    this.element.style.width = w + 'px';
    this.element.style.height = h + 'px';
    this.element.style.left = (window.innerWidth - w) / 2 + 'px';
    this.element.style.top = (window.innerHeight - h) / 2 + 'px';
  }

  close() {
    if (this.element) {
      this.element.parentElement.remove();
      this.element.remove();
    }
    const overlay = document.querySelector('.floating-window-overlay');
    if (overlay) overlay.remove();
    currentFloatingWindow = null;
  }
}

/* ============ */
  const el = document.getElementById('navList');
  el.innerHTML = NAV.map(n => `
    <div class="nav-item ${n.id===currentView?'active':''} ${!n.ready?'disabled':''}" data-id="${n.id}">
      <span>${n.label}</span>
      ${!n.ready ? '<span class="nav-soon">em breve</span>' : ''}
    </div>
  `).join('');
  el.querySelectorAll('.nav-item').forEach(item => {
    const nav = NAV.find(n => n.id === item.dataset.id);
    if (!nav.ready) return;
    item.addEventListener('click', () => { currentView = nav.id; renderNav(); renderMain(); toggleNavMobile(true); });
  });
}
function toggleNavMobile(forceClose){
  const sidebar = document.querySelector('.sidebar');
  const backdrop = document.getElementById('navBackdrop');
  const open = forceClose ? false : !sidebar.classList.contains('open');
  sidebar.classList.toggle('open', open);
  backdrop.classList.toggle('open', open);
}

/* ============ API ============ */
function isConfigurado(){ return CRM_API_URL && CRM_API_URL.indexOf('COLE_AQUI') === -1; }
async function apiCall(action, dados){
  const res = await fetch(CRM_API_URL, { method:'POST', body: JSON.stringify({ action, dados: dados||{} }) });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'Erro desconhecido');
  return json.dados;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatBRL(n){ return (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function maskWhatsapp(v){
  v = v.replace(/\D/g,'').slice(0,11);
  if (v.length>10) v = v.replace(/(\d{2})(\d{5})(\d{0,4})/,'($1) $2-$3');
  else v = v.replace(/(\d{2})(\d{4})(\d{0,4})/,'($1) $2-$3');
  return v;
}
function maskData(v){
  v = v.replace(/\D/g,'').slice(0,8);
  v = v.replace(/(\d{2})(\d)/,'$1/$2').replace(/(\d{2})\/(\d{2})(\d)/,'$1/$2/$3');
  return v;
}
function maskHora(v){
  v = v.replace(/\D/g,'').slice(0,4);
  v = v.replace(/(\d{2})(\d{1,2})/,'$1:$2');
  return v;
}
function aplicarMascara(id, fn){
  const input = document.getElementById(id);
  if (!input) return;
  input.addEventListener('input', () => { input.value = fn(input.value); });
}
function opcoesSelect(lista, valorAtual){
  const itens = (lista || []).slice();
  if (valorAtual && !itens.includes(valorAtual)) itens.push(valorAtual);
  return `<option value="">— Selecione —</option>` + itens.map(v =>
    `<option value="${esc(v)}" ${valorAtual===v?'selected':''}>${esc(v)}</option>`
  ).join('');
}
function showToast(msg){
  const root = document.getElementById('toastRoot');
  root.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  setTimeout(() => { root.innerHTML=''; }, 2600);
}
async function carregarTudo(){
  const r = await apiCall('carregarTudo');
  clientes = r.clientes; eventos = r.eventos; leads = r.leads; financeiro = r.financeiro;
  producao = r.producao; custos = r.custos; listas = r.listas || {};
  freelanceEventos = r.freelanceEventos; templates = r.templates || [];
  contasEmAtraso = r.contasEmAtraso || [];
  loaded = true;
}
 
/* ============ RENDER PRINCIPAL ============ */
async function renderMain(){
  const main = document.getElementById('mainArea');
  if (!isConfigurado()){
    main.innerHTML = `<div class="panel"><div class="loading-note" style="padding:24px;">Configure a constante <code>CRM_API_URL</code> no topo do arquivo com o link do backend do CRM (Apps Script) para começar a usar.</div></div>`;
    return;
  }
  if (!loaded){
    main.innerHTML = `<div class="loading-note">Carregando dados…</div>`;
    try { await carregarTudo(); } catch(err){ main.innerHTML = `<div class="form-err">Não foi possível carregar os dados: ${esc(err.message)}</div>`; return; }
  }
  if (currentView === 'dashboard') renderDashboard(main);
  else if (currentView === 'clientes') renderClientes(main);
  else if (currentView === 'eventos') renderEventos(main);
  else if (currentView === 'leads') renderLeads(main);
  else if (currentView === 'financeiro') renderFinanceiro(main);

function renderDashboard(main){
  const confirmados = eventos.filter(e => e.Status === 'Confirmado').length;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const proximos = eventos
    .filter(e => e['Data do evento'])
    .map(e => ({ ...e, _data: parseDataBR(e['Data do evento']) }))
    .filter(e => e._data && e._data >= hoje)
    .sort((a,b) => a._data - b._data)
    .slice(0, 8);
 
  main.innerHTML = `
    <div class="view-header"><div><h1>Dashboard</h1><p>Panorama geral do negócio.</p></div></div>
    <div class="kpi-row">
      <div class="kpi-card"><div class="kpi-label">Clientes cadastrados</div><div class="kpi-value">${clientes.length}</div></div>
      <div class="kpi-card"><div class="kpi-label">Eventos no total</div><div class="kpi-value">${eventos.length}</div></div>
      <div class="kpi-card"><div class="kpi-label">Eventos confirmados</div><div class="kpi-value">${confirmados}</div></div>
      <div class="kpi-card"><div class="kpi-label">Próximos eventos</div><div class="kpi-value">${proximos.length}</div></div>
    </div>
    <div class="panel">
      <h2>Próximos eventos</h2>
      ${proximos.length ? `<table class="responsive-table">
        <thead><tr><th>Data</th><th>Cliente</th><th>Tipo</th><th>Pacote</th><th>Status</th></tr></thead>
        <tbody>${proximos.map(e => `
          <tr><td data-label="Data">${esc(e['Data do evento'])}</td><td data-label="Cliente">${esc(e['Cliente / Responsável'])}</td><td data-label="Tipo">${esc(e['Tipo de evento'])}</td><td data-label="Pacote">${esc(e['Pacote'])}</td><td data-label="Status"><span class="status-pill ${String(e.Status).toLowerCase()==='confirmado'?'confirmado':''}">${esc(e.Status)}</span></td></tr>
        `).join('')}</tbody></table>` : `<div class="empty-state">Nenhum evento futuro cadastrado ainda.</div>`}
    </div>
  `;
}
function parseDataBR(s){
  const p = String(s).split('/');
  if (p.length !== 3) return null;
  return new Date(p[2], p[1]-1, p[0]);
}

async function excluirComConfirmacao(mensagem, action, dados, btnId, erroId){
  if (!confirm(mensagem)) return;
  const btn = document.getElementById(btnId);
  if (btn){ btn.disabled = true; btn.textContent = 'Excluindo…'; }
  try{
    await apiCall(action, dados);

  } catch(err){

async function excluirEventoComConfirmacao(evento){
  const mensagem = `Excluir o evento de "${evento['Cliente / Responsável']}" em ${evento['Data do evento'] || '(sem data)'}? Isso remove também a produção, o compromisso na Agenda, os custos e as parcelas do Financeiro. Não pode ser desfeito.`;

  try{
    await apiCall('excluirEvento', { idEvento: evento['ID Evento'] });
    loaded = false; fecharOverlay(); await renderMain(); showToast('Excluído.');
  } catch(err){
    const bloqueadoPorPagamento = /recebido/.test(err.message);
    if (bloqueadoPorPagamento && confirm(err.message + '\n\nSe for um evento de teste, você pode excluir mesmo assim — isso apaga também o valor recebido do Financeiro, sem estorno real. Confirma a exclusão forçada?')){
      try{
        await apiCall('excluirEvento', { idEvento: evento['ID Evento'], forcar: true });

  }

/* ============ FINANCEIRO ============ */
function agruparContas(){
  const grupos = {};
  financeiro.forEach(p => {
    const key = p['ID Evento'];
    if (!grupos[key]) grupos[key] = { idEvento: key, cliente: p['Cliente'], parcelas: [] };
    grupos[key].parcelas.push(p);
  });
  return Object.values(grupos).map(g => {
    const totalPrevisto = g.parcelas.reduce((s,p) => s + Number(p['Valor previsto']||0), 0);
    const totalPago = g.parcelas.reduce((s,p) => s + Number(p['Valor pago']||0), 0);
    const saldo = totalPrevisto - totalPago;
    const temVencida = g.parcelas.some(p => p['Status'] === 'Vencida');
    const status = saldo <= 0 ? 'Quitado' : (temVencida ? 'Vencida' : (totalPago > 0 ? 'Parcial' : 'Pendente'));
    return Object.assign(g, { totalPrevisto, totalPago, saldo, status });
  });
}

  if (!evento){ info.textContent = ''; return; }
  const valorFinal = Number(evento['Valor final'] || 0);
  const entrada = Number(document.getElementById('f_entradaValor').value || 0);
  const somaParcelas = Array.from(document.querySelectorAll('.p-valor')).reduce((s, inp) => s + (Number(inp.value) || 0), 0);

async function salvarConta(idEventoExistente){
  const idEvento = idEventoExistente || document.getElementById('f_idEvento').value;
  if (!idEvento){ mostrarErro('contaErr','Escolha um evento.'); return; }
 
  const entradaValor = Number(document.getElementById('f_entradaValor').value || 0);
  const entrada = entradaValor > 0 ? {
    idParcela: document.getElementById('f_entradaIdParcela').value || undefined,
    valor: entradaValor,
    status: document.getElementById('f_entradaStatus').value,
    formaPagamento: document.getElementById('f_entradaForma').value,
    dataPagamento: document.getElementById('f_entradaDataPagamento').value.trim(),
  } : null;
 
  const parcelas = Array.from(document.querySelectorAll('.linha-parcela')).map(linha => ({
    idParcela: linha.dataset.idParcela || undefined,
    tipoCobranca: linha.querySelector('.p-tipo').value,
    vencimento: linha.querySelector('.p-venc').value.trim(),
    valor: Number(linha.querySelector('.p-valor').value || 0),
    status: linha.querySelector('.p-status').value,
    formaPagamento: linha.querySelector('.p-forma').value,
    dataPagamento: linha.querySelector('.p-dataPagamento').value.trim(),
    valorPago: Number(linha.querySelector('.p-valorPago').value || 0),
  }));
  if (parcelas.some(p => !p.valor)){ mostrarErro('contaErr','Preencha o valor de todas as parcelas.'); return; }
  if (!entrada && !parcelas.length){ mostrarErro('contaErr','Informe a entrada ou ao menos uma parcela.'); return; }
 
  const btn = document.getElementById('salvarContaBtn'); btn.disabled = true; btn.textContent = 'Salvando…';
  try{
    await apiCall('salvarConta', { idEvento, entrada, parcelas });
    loaded = false; fecharOverlay(); await renderMain(); showToast('Conta salva.');
  } catch(err){ mostrarErro('contaErr', err.message); btn.disabled=false; btn.textContent = idEventoExistente?'Salvar conta':'Criar conta'; }
}

function agruparReceitaCusto(){
  const porEvento = {};
  eventos.forEach(e => {
    porEvento[e['ID Evento']] = { idEvento: e['ID Evento'], cliente: e['Cliente / Responsável'], receita: Number(e['Valor final']||0), custo: 0 };
  });
  custos.forEach(c => {
    const g = porEvento[c['ID Evento']];
    if (g) g.custo += Number(c['Valor']||0);
  });
  return Object.values(porEvento)
    .filter(g => g.receita > 0 || g.custo > 0)
    .map(g => Object.assign(g, { margem: g.receita - g.custo, margemPct: g.receita ? ((g.receita - g.custo) / g.receita * 100) : 0 }));
}
function renderCustos(main){
  const total = custos.reduce((s,c) => s + Number(c['Valor']||0), 0);

async function abrirFormTemplate(indice) {
  const tpl = indice !== null ? templates[indice] : null;
  const titulo = tpl ? 'Editar Template' : 'Novo Template';
  const nome = tpl ? tpl['Nome'] : '';
  const descricao = tpl ? tpl['Descrição'] : '';
  const corpo = tpl ? tpl['Corpo'] : '';

  document.getElementById('overlayRoot').innerHTML = `
    <div class="form-overlay" id="overlay">
      <div class="form-panel">
        <h2>${titulo}</h2>
        <div id="formErr" class="form-err" style="display:none;"></div>
        <form id="formTemplate" style="display:flex;flex-direction:column;gap:16px;">
          <div class="field">
            <label>Nome do Template *</label>
            <input type="text" id="tplNome" value="${esc(nome)}" placeholder="Ex: LEVE, MÉDIA, PESADA ou seu custom" required>
          </div>
          <div class="field">
            <label>Descrição *</label>
            <input type="text" id="tplDescricao" value="${esc(descricao)}" placeholder="Ex: Primeira abordagem - Educada" required>
          </div>
          <div class="field">
            <label>Corpo da Mensagem * (use {{cliente}}, {{valor}}, {{diasAtraso}}, {{vencimento}})</label>
            <textarea id="tplCorpo" style="min-height:120px;font-family:monospace;font-size:12px;" placeholder="Escreva o corpo da mensagem com as variáveis..." required>${esc(corpo)}</textarea>
            <div id="tplPreview" style="margin-top:12px;padding:12px;background:var(--paper);border:1px solid var(--rule);border-radius:3px;font-size:12px;white-space:pre-wrap;color:var(--ink);max-height:150px;overflow-y:auto;display:none;"></div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn-ghost" onclick="fecharOverlay()">Cancelar</button>
            <button type="submit" class="btn-primary">💾 Salvar</button>
          </div>
        </form>
      </div>
    </div>
  `;

  const form = document.getElementById('formTemplate');
  const preview = document.getElementById('tplPreview');
  const corpoInput = document.getElementById('tplCorpo');

  corpoInput.addEventListener('input', () => {
    const corpo = corpoInput.value;
    const preenchido = corpo
      .replace(/\{\{cliente\}\}/g, 'João Silva')
      .replace(/\{\{valor\}\}/g, '1.500,00')
      .replace(/\{\{diasAtraso\}\}/g, '5')
      .replace(/\{\{vencimento\}\}/g, '25/09/2026');
    preview.textContent = preenchido;
    preview.style.display = 'block';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const nome = document.getElementById('tplNome').value.trim();
    const descricao = document.getElementById('tplDescricao').value.trim();
    const corpo = document.getElementById('tplCorpo').value.trim();

    if (!nome) {
      mostrarErro('formErr', 'Nome é obrigatório');
      return;
    }
    if (!descricao) {
      mostrarErro('formErr', 'Descrição é obrigatória');
      return;
    }
    if (!corpo) {
      mostrarErro('formErr', 'Corpo é obrigatório');
      return;
    }

    try {
      if (tpl) {
        await apiCall('atualizarTemplate', { id: tpl['ID'], nome, descricao, corpo });
        showToast('✅ Template atualizado');
      } else {
        await apiCall('criarTemplate', { nome, descricao, corpo });
        showToast('✅ Template criado');
      }
      loaded = false;
      await renderMain();
      fecharOverlay();
    } catch (err) {
      mostrarErro('formErr', err.message);
    }
  });

  document.getElementById('overlay').addEventListener('click', (e) => {
    if (e.target.id === 'overlay') fecharOverlay();
  });
}

async function confirmarDeletarTemplate(indice) {
  const tpl = templates[indice];
  if (!tpl || tpl['Padrão'] === 'Sim') {
    showToast('⚠️ Não é possível deletar templates padrão');
    return;
  }

  if (confirm(`Tem certeza que deseja deletar o template "${tpl['Nome']}"?`)) {
    try {
      await apiCall('deletarTemplate', { id: tpl['ID'] });
      showToast('✅ Template deletado');
      loaded = false;
      await renderMain();
    } catch (err) {
      showToast('❌ Erro: ' + err.message);
    }
  }
}

function atualizarRecebidoFiltro(){
  const de = parseDataBR(document.getElementById('freelanceDe').value);
  const ate = parseDataBR(document.getElementById('freelanceAte').value);
  let total = 0;
  freelanceEventos.forEach(ev => {
    (ev.pagamentos||[]).forEach(p => {
      const d = parseDataBR(p['Data do pagamento']);
      if (!d) return;
      if (de && d < de) return;
      if (ate && d > ate) return;
      total += Number(p['Valor pago']||0);
    });
  });
  document.getElementById('freelanceRecebidoFiltro').textContent = (de||ate) ? formatBRL(total) : '—';
}
function desenharTabelaFreelance(){
  const el = document.getElementById('tabelaFreelance');
  if (!freelanceEventos.length){ el.innerHTML = `<div class="empty-state">Nenhum freelance cadastrado ainda.</div>`; return; }
  const comData = freelanceEventos.map(ev => Object.assign({ _data: parseDataBR(ev['Data']) }, ev));
  const ordenados = comData.sort((a,b) => {
    const da = a._data ? a._data.getTime() : -Infinity;
    const db = b._data ? b._data.getTime() : -Infinity;
    return freelanceOrdemData === 'desc' ? db - da : da - db;
  });
  const seta = freelanceOrdemData === 'desc' ? '↓' : '↑';
  el.innerHTML = `
    <table class="responsive-table">
      <thead><tr><th id="thDataFreelance" style="cursor:pointer;">Data ${seta}</th><th>Nome do evento</th><th>Fotografia</th><th>Total</th><th>Trabalho</th><th>Pagamento</th><th>Pendente</th></tr></thead>

async function salvarPagamentoFreelance(idEvento){

async function abrirCopiadorMensagem(conta) {
  try {
    // Carrega os templates do backend
    const result = await apiCall('obterTemplatesMensagem');
    const { templates } = result;

    if (!templates || !templates.length) {
      showToast('Nenhum template disponível');
      return;
    }

    // Prepara dados dinâmicos
    const idParcela = conta['ID Parcela'] || '';
    const cliente = conta['Cliente'] || 'Cliente';
    const valor = Number(conta['Valor'] || 0).toFixed(2);
    const diasAtraso = conta['diasEmAtraso'] || 0;
    const vencimento = conta['Vencimento'] || 'N/A';
    const tentativasAtuais = Number(conta['Tentativas Cobranca'] || 0);
    const maxTentativas = 3;

    // Função para preencher variáveis
    const preencherTemplate = (template) => {
      return template
        .replace(/\{\{cliente\}\}/g, cliente)
        .replace(/\{\{valor\}\}/g, valor)
        .replace(/\{\{diasAtraso\}\}/g, diasAtraso)
        .replace(/\{\{vencimento\}\}/g, vencimento);
    };

    // Cria HTML do modal com botão de registro
    const templateCards = templates.map((tpl, idx) => {
      const corpoPreenchido = preencherTemplate(tpl.corpo);
      const progresso = tentativasAtuais + 1;
      const podeRegistrar = progresso <= maxTentativas;
      return `
        <div class="template-card" style="background:var(--paper-raised);border:1px solid var(--rule);border-radius:4px;padding:16px;margin-bottom:16px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <div>
              <strong style="color:var(--gold);">${tpl.nome}</strong>
              <p style="color:var(--ink-soft);font-size:12px;margin:4px 0 0;">${tpl.descricao}</p>
            </div>
            <div style="text-align:right;font-size:11px;color:var(--ink-soft);">
              Tentativa: <strong style="color:var(--ink);">${progresso}/${maxTentativas}</strong>
            </div>
          </div>
          <textarea readonly style="width:100%;min-height:140px;padding:12px;border:1px solid var(--rule);border-radius:3px;background:var(--paper);font-family:monospace;font-size:12px;resize:none;color:var(--ink);">${corpoPreenchido}</textarea>
          <div style="display:flex;gap:8px;margin-top:10px;">
            <button class="btn-primary" style="flex:1;" onclick="copiarMensagem('${tpl.id}', ${idx}); event.preventDefault();">
              📋 Copiar
            </button>
            <button class="btn-primary" style="flex:1;background:var(--ok);" onclick="marcarEnvio('${idParcela}', '${tpl.id}', ${idx}); event.preventDefault();" ${!podeRegistrar ? 'disabled style="opacity:0.5;"' : ''}>
              ✅ Enviado
            </button>
          </div>
        </div>
      `;
    }).join('');

    document.getElementById('overlayRoot').innerHTML = `
      <div class="form-overlay" id="overlay">
        <div class="form-panel" style="max-width:680px;">
          <h2>📧 Copiar Mensagem de Cobrança</h2>
          <p style="color:var(--ink-soft);font-size:13px;margin-bottom:20px;">
            Cliente: <strong>${cliente}</strong> • Valor: <strong>R$ ${valor}</strong> • Dias: <strong>${diasAtraso}</strong> • Tentativas: <strong>${tentativasAtuais}/${maxTentativas}</strong>
          </p>
          <div id="copiadorMensagensTipos">
            ${templateCards}
          </div>
          <div class="form-actions" style="margin-top:20px;">
            <button class="btn-ghost" onclick="fecharOverlay()">Fechar</button>
          </div>
        </div>
      </div>
    `;

    // Event listener para fechar ao clicar no fundo
    document.getElementById('overlay').addEventListener('click', (e) => {
      if (e.target.id === 'overlay') fecharOverlay();
    });
  } catch (err) {
    mostrarErro('modalErr', 'Erro ao carregar templates: ' + err.message);
  }
}

function copiarMensagem(templateId, index) {
  const textareas = document.querySelectorAll('.template-card textarea');
  if (textareas[index]) {
    const texto = textareas[index].value;
    navigator.clipboard.writeText(texto).then(() => {
      showToast(`✅ Mensagem copiada! Pronto para enviar via WhatsApp.`);
    }).catch(() => {
      // Fallback para navegadores mais antigos
      const textarea = document.createElement('textarea');
      textarea.value = texto;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      showToast(`✅ Mensagem copiada! Pronto para enviar via WhatsApp.`);
    });
  }
}

async function marcarEnvio(idParcela, templateId, index) {
  if (!idParcela) {
    showToast('❌ Erro: ID da parcela não encontrado');
    return;
  }

  try {
    const btn = event.target;
    btn.disabled = true;
    btn.textContent = 'Registrando…';

    // Chama o backend para registrar o envio
    await apiCall('registrarEnvioManual', {
      idParcela: idParcela,
      templateUsado: templateId,
      usuarioEnviou: 'Manual (App)'
    });

    showToast(`✅ Envio registrado! Aguardando resposta do cliente.`);

    // Recarrega os dados e fecha o modal
    loaded = false;
    await renderMain();
    fecharOverlay();

  } catch (err) {
    event.target.disabled = false;
    event.target.textContent = '✅ Enviado';

    if (err.message.includes('Máximo de 3 tentativas')) {
      showToast('⚠️ 3 tentativas atingidas. Cliente será bloqueado.');
      setTimeout(() => {
        loaded = false;
        renderMain();
        fecharOverlay();
      }, 1500);
    } else {
      mostrarErro('modalErr', 'Erro ao registrar envio: ' + err.message);
    }
  }
}
    });
  }
}

    const fw = new FloatingWindow('copiadorMensagensFlutuante', { saveName: 'copiadorMensagens' });
    fw.create('📧 Copiar Mensagem de Cobrança', htmlContent);
  } catch (err) {
    showToast('❌ Erro: ' + err.message);
  }
}
