<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vitrine de fotos</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--accent:#A8791E;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Work Sans',sans-serif;transition:background .2s,color .2s;}
  body.serif h1, body.serif .titulo{font-family:'Fraunces',serif;font-weight:500;}
  body.sans h1, body.sans .titulo{font-family:'Work Sans',sans-serif;font-weight:600;}

  /* Temas: cada um define papel/tinta/painel; a cor de destaque (--accent) vem
     da vitrine (cor_primaria) e é aplicada por cima, inline, em runtime. */
  body.tema-linen{background:#FBF9F4;color:#221F1C;}
  body.tema-linen .painel{background:#FFFFFF;border:1px solid #DCD4C4;}
  body.tema-noir{background:#15141A;color:#EDEAE2;}
  body.tema-noir .painel{background:#1E1D24;border:1px solid #33323C;}
  body.tema-terra{background:#2E2419;color:#F1E9DC;}
  body.tema-terra .painel{background:#3C3022;border:1px solid #5A4A34;}

  .header{display:flex;height:clamp(360px,52vh,560px);}
  .header-info{flex:1 1 50%;display:flex;flex-direction:column;justify-content:center;padding:40px clamp(20px,4vw,56px);gap:6px;min-width:0;}
  .header-logo{max-width:260px;max-height:140px;object-fit:contain;margin-bottom:10px;}
  /* Logo é preta (fundo transparente) — nos temas escuros inverte pra branca, senão fica invisível. */
  body.tema-noir .header-logo, body.tema-terra .header-logo{filter:invert(1);}
  .header-logo-texto{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.65;margin:0 0 10px;}
  .header-kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin:0;}
  .header-info h1{font-size:clamp(26px,3.6vw,40px);margin:4px 0 0;line-height:1.15;}
  .header-data{font-size:14px;opacity:.7;margin:8px 0 0;}
  .header-btn{width:auto !important;align-self:flex-start;margin-top:20px;}
  .header-capa{flex:1 1 50%;overflow:hidden;background:rgba(128,128,128,.08);}
  .header-capa img{width:100%;height:100%;object-fit:contain;display:block;}
  @media (max-width:760px){
    .header{flex-direction:column;height:auto;}
    .header-info{padding:32px 20px 20px;}
    .header-logo{display:block;margin-left:auto;margin-right:auto;}
    .header-capa{height:46vh;}
  }

  .info-linha{font-size:12.5px;opacity:.65;margin:0 0 18px;}

  .wrap{max-width:980px;margin:0 auto;padding:28px 20px 60px;}
  .painel{border-radius:10px;padding:22px 20px;margin-bottom:20px;}
  .msg{text-align:center;padding:60px 20px;}
  .msg p{opacity:.75;font-size:14px;line-height:1.6;}

  .spinner-wrap{text-align:center;padding:50px 20px;opacity:.75;}
  .spinner{width:28px;height:28px;margin:0 auto 14px;border-radius:50%;
    border:3px solid rgba(128,128,128,.25);border-top-color:var(--accent);
    animation:girar .8s linear infinite;}
  @keyframes girar{to{transform:rotate(360deg);}}

  .field label{display:block;font-size:13px;opacity:.75;margin-bottom:6px;}
  .field input{width:100%;font-family:'Work Sans',sans-serif;font-size:15px;padding:11px 12px;border-radius:6px;border:1px solid #DCD4C4;background:rgba(255,255,255,.08);color:inherit;}
  body.tema-linen .field input{background:#FBF9F4;color:#221F1C;}
  button{font-family:'Work Sans',sans-serif;cursor:pointer;border-radius:6px;border:none;padding:11px 18px;font-size:14px;}
  .btn-primary{background:var(--accent);color:#fff;width:100%;}
  .btn-primary:hover{opacity:.9;}
  .erro{color:#E2726B;font-size:13px;margin-top:10px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}
  .foto{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1;background:rgba(255,255,255,.06);border:3px solid transparent;}
  .foto.selecionada{border-color:var(--accent);}
  .foto img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer;}
  .foto a.baixar{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;width:30px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:14px;}
  .foto .coracao{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.45);border-radius:999px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:16px;padding:0;}
  .foto.pendente-marca a.baixar{opacity:.4;cursor:wait;}
  .foto.pendente-marca::after{content:'protegendo…';position:absolute;left:6px;bottom:6px;font-size:10px;letter-spacing:.03em;background:rgba(0,0,0,.6);color:#fff;padding:2px 6px;border-radius:999px;pointer-events:none;}

  .acoes-topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  .acoes-topo button{background:var(--accent);color:#fff;}
  .contador{font-size:13.5px;opacity:.85;}

  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px;}
  .lightbox img{max-width:100%;max-height:85vh;border-radius:6px;}
  .lightbox-fechar{position:absolute;top:18px;right:22px;color:#fff;font-size:28px;background:none;cursor:pointer;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px;}
  .modal-overlay .painel{margin:0;max-width:380px;width:100%;}
  .modal-overlay p{margin:0 0 18px;font-size:14px;line-height:1.5;}
  .modal-acoes{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
  .modal-acoes button{width:auto;}
  .btn-secundario{background:transparent;border:1px solid currentColor;opacity:.7;color:inherit;}

  .entrega{margin-top:34px;padding-top:26px;border-top:1px solid rgba(128,128,128,.25);}
  .entrega h2{font-size:20px;margin:0 0 4px;}
  .entrega-sub{font-size:13px;opacity:.75;margin:0 0 16px;}
  .album-titulo{font-size:14px;font-weight:600;margin:18px 0 8px;opacity:.85;}
  .album-titulo:first-child{margin-top:0;}
</style>
</head>
<body class="tema-linen serif">
<div id="app"><div class="wrap"><div class="spinner-wrap"><div class="spinner"></div><p>Carregando…</p></div></div></div>

<!-- Reaproveita a config/instância do PocketBase já usada no CRM (sem login:
     esta página nunca chama pbAuthGarantir — o acesso é só pelo token público). -->
<script src="https://cdn.jsdelivr.net/npm/pocketbase@0.21.5/dist/pocketbase.umd.js"></script>
<!-- JSZip (v3.20.9): agrupa várias fotos num único .zip pra baixar de uma vez
     só — evita o bloqueio do navegador pra >10 downloads automáticos seguidos
     (ver "Baixar todas as fotos"/"Baixar tudo em alta resolução" mais abaixo). -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="assets/js/config.js?v=3.19.0"></script>
<script src="assets/js/pbCore.js?v=3.15.1"></script>
<script>
const params = new URLSearchParams(location.search);
const TOKEN = (params.get('token') || '').trim();
const app = document.getElementById('app');

function escV(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Se for um link de "ver"/"compartilhar" do Drive (não uma imagem direta),
// converte para a URL de thumbnail do Drive — senão o <img>/background-image
// tenta carregar uma página HTML e falha. URLs que não são do Drive passam
// direto (campo "Capa" aceita qualquer imagem externa, não só do Drive).
function driveImgUrl_(url){
  const s = String(url || '');
  if (!s || s.indexOf('drive.google.com') === -1) return s;
  const m = s.match(/[-\w]{25,}/);
  return m ? ('https://drive.google.com/thumbnail?id=' + m[0] + '&sz=w1600') : s;
}

async function buscarVitrine_(token, senhaHash){
  pbInit();
  return PB.collection('vitrines').getFirstListItem(PB.filter('token = {:t}', { t: token }), { token, senha_hash: senhaHash || '' });
}
async function buscarFotosProprio_(vitrinePbId, token, senhaHash){
  return PB.collection('vitrine_fotos').getFullList({
    filter: PB.filter('id_vitrine = {:v}', { v: vitrinePbId }),
    sort: 'ordem', token, senha_hash: senhaHash || '',
  });
}
async function buscarFotosDrive_(linkPasta){
  const res = await fetch(CRM_API_URL + '?pasta=' + encodeURIComponent(linkPasta));
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'Não foi possível listar as fotos da pasta do Drive');
  return json.arquivos;
}

/* ---- Marca d'água opcional (v3.20.1) — mesmo algoritmo de pbVitrines.js
   (tiles o texto em diagonal, redimensiona pro lado maior ~1600px), mas
   rodando aqui no navegador de QUEM VISITA a vitrine, não da fotógrafa:
   - upload_proprio: a marca já vem PRONTA (gerada no upload, ver pbVitrines.js)
     — aqui só decide servir o arquivo 'preview' (marcado) ou 'arquivo' (original).
   - google_drive: não existe um passo de upload pra marcar uma vez só, então a
     marca é gerada SOB DEMANDA no navegador de cada visitante, ao vivo (sem
     cache/infra nova) — o endpoint final do Drive (lh3.googleusercontent.com)
     manda 'Access-Control-Allow-Origin: *', então dá pra baixar via fetch()
     e desenhar num <canvas> sem "sujar" o canvas (confirmado com curl -I
     antes de implementar). Sem isso habilitado, modo Drive continua 100%
     como antes (nenhum fetch/processamento extra). */
const VITRINE_MARCA_DAGUA_TEXTO = 'CIBELE MATOZO FOTOGRAFIA';
const VITRINE_MARCA_DAGUA_LADO_MAX = 1600;

async function marcaDaguaCanvas_(origem){
  const bitmap = await createImageBitmap(origem);
  const escala = Math.min(1, VITRINE_MARCA_DAGUA_LADO_MAX / Math.max(bitmap.width, bitmap.height));
  const w = Math.max(1, Math.round(bitmap.width * escala));
  const h = Math.max(1, Math.round(bitmap.height * escala));

  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(bitmap, 0, 0, w, h);
  bitmap.close();

  const fonte = Math.max(16, Math.round(w / 22));
  ctx.save();
  ctx.translate(w / 2, h / 2);
  ctx.rotate(-Math.PI / 6);
  ctx.font = 'bold ' + fonte + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 1;
  const passoX = ctx.measureText(VITRINE_MARCA_DAGUA_TEXTO).width + 70;
  const passoY = fonte * 3;
  const diag = Math.sqrt(w * w + h * h);
  for (let y = -diag; y < diag; y += passoY){
    for (let x = -diag; x < diag; x += passoX){
      ctx.strokeText(VITRINE_MARCA_DAGUA_TEXTO, x, y);
      ctx.fillText(VITRINE_MARCA_DAGUA_TEXTO, x, y);
    }
  }
  ctx.restore();
  return new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.85));
}

// Endpoint FINAL de imagem do Drive, sem passar pelo redirect intermediário
// de drive.google.com/thumbnail — esse redirect (302) não manda
// Access-Control-Allow-Origin na resposta de redirect em si, e o Firefox
// (confirmado em produção) recusa seguir um redirect cross-origin em modo
// 'cors' se a resposta do 302 não tiver o cabeçalho, mesmo a URL final tendo
// (o endpoint direto já manda 'Access-Control-Allow-Origin: *' sempre).
function driveUrlDireta_(id, tamanho){
  // tamanho=0 (ou omitido) → original sem redimensionar (=s0), usado pelo zip
  // de "Baixar todas"/"Baixar tudo em alta resolução"; qualquer outro valor é
  // o lado maior em pixels (=w<tamanho>, usado pela marca d'água).
  return 'https://lh3.googleusercontent.com/d/' + id + (tamanho ? '=w' + tamanho : '=s0');
}

// Baixa a foto original do Drive e devolve uma URL local (blob:) já com a
// marca d'água — pra usar no <img src>, no data-ver do lightbox e no href
// de "baixar". Falha (CORS bloqueado, rede) → null, e quem chamou mantém a
// URL direta do Drive (sem marca) como já fazia antes desta versão.
async function marcaDaguaDriveUrl_(urlOrigem){
  try {
    const res = await fetch(urlOrigem);
    if (!res.ok) return null;
    const blob = await marcaDaguaCanvas_(await res.blob());
    return blob ? URL.createObjectURL(blob) : null;
  } catch (err){
    console.error("Marca d'água (Drive) falhou, mostrando foto sem marca: " + err);
    return null;
  }
}

// Roda em segundo plano, depois da grade já estar na tela (não atrasa o
// primeiro carregamento) — processa algumas fotos por vez pra não disparar
// dezenas de downloads simultâneos. Só é chamado quando fonte=google_drive
// e a marca d'água está habilitada nesta vitrine.
async function aplicarMarcaDaguaDriveNaGrade_(fotos){
  const CONCORRENCIA = 3;
  const TENTATIVAS = 3; // rede instável do visitante — não desiste na primeira
  let indice = 0;
  // Libera "baixar"/"ver" do card (com ou sem marca — ver comentário abaixo).
  function liberarCard_(f){
    const card = document.querySelector('.foto[data-ref="' + CSS.escape(String(f.id)) + '"]');
    if (!card) return;
    card.classList.remove('pendente-marca');
    const baixar = card.querySelector('a.baixar');
    if (baixar){ baixar.href = f.baixar; baixar.title = 'Baixar'; delete baixar.dataset.pendente; }
  }
  async function processarProximo(){
    const i = indice++;
    if (i >= fotos.length) return;
    const f = fotos[i];
    let url = null;
    for (let t = 0; t < TENTATIVAS && !url; t++){
      // Usa o endpoint direto (sem redirect) pra evitar o erro de CORS no
      // redirect intermediário do drive.google.com/thumbnail (ver driveUrlDireta_).
      url = await marcaDaguaDriveUrl_(driveUrlDireta_(f.id, 2000));
    }
    if (url){
      // Atualiza o objeto (não só o DOM): "Baixar todas as fotos" lê f.baixar
      // direto do array em memória, não do href do botão individual.
      f.thumb = url; f.ver = url; f.baixar = url;
      const card = document.querySelector('.foto[data-ref="' + CSS.escape(String(f.id)) + '"]');
      if (card){
        const img = card.querySelector('img');
        if (img){ img.src = url; img.dataset.ver = url; }
      }
    }
    // Libera o card MESMO se as 3 tentativas falharem (rede do
    // visitante, não do servidor) — serve a foto original sem marca nesse
    // caso raro em vez de deixá-la bloqueada pra sempre; aceito conscientemente,
    // mesmo nível de "melhor esforço" já usado no resto desta proteção.
    liberarCard_(f);
    return processarProximo();
  }
  await Promise.all(Array.from({ length: Math.min(CONCORRENCIA, fotos.length) }, processarProximo));
}

/* ---- "Baixar todas as fotos" / "Baixar tudo em alta resolução" (v3.20.9) ----
   Empacota as fotos num .zip e dispara UM download por arquivo gerado, em vez
   de um download por foto — o jeito antigo (um clique sintético de <a
   download> por foto, espaçados por setTimeout) faz o navegador bloquear
   silenciosamente depois de ~10 downloads automáticos em sequência sem um
   gesto novo do usuário a cada um, então galerias com mais de ~10 fotos
   perdiam parte dos arquivos sem avisar ninguém. Usado pelos dois botões de
   download em massa da vitrine (galeria principal e entrega final). */

// Pro zip, NÃO confia cegamente no campo de origem quando a fonte é o Drive:
// se a marca d'água ainda não foi aplicada a esta foto específica (switch
// desligado, ou as 3 tentativas falharam e liberarCard_ seguiu em frente sem
// marca), o campo ainda aponta pro link antigo (uc?export=download), que não
// é confiável via fetch() (pode devolver página de aviso em vez do arquivo).
// Nesse caso, ignora e usa o endpoint direto (=s0, sem redimensionar).
function urlParaZip_(f, vitrine){
  if (String(f.baixar).startsWith('blob:')) return f.baixar; // já marcado, local, fetch trivial
  if (vitrine.fonte_imagens === 'google_drive') return driveUrlDireta_(f.id, 0);
  return f.baixar; // upload_proprio: já é URL do PocketBase (CORS ok)
}

const ZIP_LOTE_TAMANHO = 20; // fotos por parte do zip — ver nota de memória/qtd de downloads abaixo
const ZIP_CONCORRENCIA = 3;  // mesmo valor de aplicarMarcaDaguaDriveNaGrade_
const ZIP_TENTATIVAS = 3;

function esperarMs_(ms){ return new Promise((r) => setTimeout(r, ms)); }

function nomeArquivoVitrine_(vitrine){
  const base = String(vitrine.nome_exibicao || 'fotos').replace(/[\\/:*?"<>|]+/g, ' ').trim();
  return base || 'fotos';
}

// itens: lista normalizada [{id, nome, baixar}, ...] — a galeria principal já
// tem esse formato (array `fotos`); a entrega final mapeia `baixarLimpo` pra
// `baixar` antes de chamar. opts.sufixo entra no nome do arquivo (ex.:
// 'entrega'); opts.aoConcluirFoto(f), se passado, roda (fire-and-forget) a
// cada foto incluída com sucesso — usado pela entrega final pra contar o
// download.
//
// Risco aceito conscientemente: pra galerias muito grandes (~200+ fotos), o
// nº de partes do zip pode chegar perto do limite de bloqueio automático do
// navegador (~10), e o pico de memória por lote é +- ZIP_LOTE_TAMANHO ×
// tamanho médio da foto × 2 (bytes de origem + buffer do zip sendo montado).
// Os dois ajustam só mexendo em ZIP_LOTE_TAMANHO — revisitar se uma galeria
// real passar muito do maior caso já visto em produção (182 fotos).
async function baixarComoZip_(itens, vitrine, btn, opts){
  opts = opts || {};
  const rotuloOriginal = btn.textContent;
  const nomeBase = nomeArquivoVitrine_(vitrine) + (opts.sufixo ? '-' + opts.sufixo : '');
  const totalPartes = Math.ceil(itens.length / ZIP_LOTE_TAMANHO);
  let concluidas = 0, falhas = 0;

  for (let parte = 0; parte < totalPartes; parte++){
    const inicio = parte * ZIP_LOTE_TAMANHO;
    const itensDaParte = itens.slice(inicio, inicio + ZIP_LOTE_TAMANHO);
    const zip = new JSZip();
    let indice = 0;

    async function processarProximo(){
      const i = indice++;
      if (i >= itensDaParte.length) return;
      const f = itensDaParte[i];
      let blob = null;
      for (let t = 0; t < ZIP_TENTATIVAS && !blob; t++){
        try {
          const res = await fetch(urlParaZip_(f, vitrine));
          if (res.ok) blob = await res.blob();
        } catch (err){ /* tenta de novo */ }
      }
      if (blob){
        // Prefixo numérico garante nome único dentro do zip (duas fotos
        // podem ter o mesmo nome original) e preserva a ordem da galeria.
        const numero = String(inicio + i + 1).padStart(4, '0');
        zip.file(numero + '-' + (f.nome || ('foto-' + (inicio + i))), blob);
        concluidas++;
        if (opts.aoConcluirFoto) opts.aoConcluirFoto(f);
      } else {
        falhas++;
      }
      btn.textContent = 'Preparando fotos… (' + (concluidas + falhas) + '/' + itens.length + ')';
      return processarProximo();
    }
    await Promise.all(Array.from({ length: Math.min(ZIP_CONCORRENCIA, itensDaParte.length) }, processarProximo));

    if (Object.keys(zip.files).length){ // pelo menos 1 foto da parte deu certo
      btn.textContent = totalPartes > 1
        ? ('Gerando parte ' + (parte + 1) + ' de ' + totalPartes + '…')
        : 'Gerando arquivo…';
      const blobZip = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
      const nomeZip = totalPartes > 1
        ? nomeBase + '-parte' + (parte + 1) + '-de-' + totalPartes + '.zip'
        : nomeBase + '.zip';
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blobZip);
      a.download = nomeZip;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
      // Espaçamento mínimo entre partes: cada parte já é, ela mesma, um
      // download disparado automaticamente — mesmo risco do bug original,
      // só que em escala bem menor (nº de partes, não nº de fotos).
      if (parte < totalPartes - 1) await esperarMs_(1200);
    }
  }

  btn.disabled = false;
  btn.textContent = rotuloOriginal;
  if (falhas && concluidas){
    await avisarVitrine_(concluidas + ' de ' + itens.length + ' fotos baixadas — ' + falhas + ' falharam, tente novamente para essas.');
  } else if (falhas && !concluidas){
    await avisarVitrine_('Não foi possível baixar nenhuma foto — verifique sua conexão e tente novamente.');
  }
}

/* ---- Seleção de fotos (v3.19 Fase 2) ---- */
async function buscarSelecoes_(vitrinePbId, token, senhaHash){
  return PB.collection('vitrine_selecoes').getFullList({
    filter: PB.filter('id_vitrine = {:v}', { v: vitrinePbId }),
    token, senha_hash: senhaHash || '',
  });
}
async function criarSelecao_(vitrinePbId, arquivoRef, nomeArquivo, token, senhaHash){
  return PB.collection('vitrine_selecoes').create(
    { id_vitrine: vitrinePbId, arquivo_ref: arquivoRef, nome_arquivo: nomeArquivo, data_selecao: new Date().toLocaleDateString('pt-BR') },
    { token, senha_hash: senhaHash || '' }
  );
}
async function apagarSelecao_(idSelecaoPb, token, senhaHash){
  return PB.collection('vitrine_selecoes').delete(idSelecaoPb, { token, senha_hash: senhaHash || '' });
}
async function criarFinalizacao_(vitrinePbId, qtd, token, senhaHash){
  return PB.collection('vitrine_finalizacoes').create(
    { id_vitrine: vitrinePbId, qtd_selecionadas: qtd, data: new Date().toLocaleDateString('pt-BR') },
    { token, senha_hash: senhaHash || '' }
  );
}
// "AAAA-MM-DDT..." (como o pb_hook grava, UTC) -> DD/MM/AAAA só pra exibir.
function dataBRDeISO_(iso){
  const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? (m[3] + '/' + m[2] + '/' + m[1]) : '';
}
// DD/MM/AAAA (texto solto, não é campo `date` do PocketBase) -> Date local, só pra comparar com hoje.
function parseDataBR_(s){
  const p = String(s || '').split('/');
  if (p.length !== 3) return null;
  const d = new Date(Number(p[2]), Number(p[1]) - 1, Number(p[0]));
  return isNaN(d.getTime()) ? null : d;
}

/* ---- Entrega final (v3.19 Fase 4) — contador "auto-declarado": o cliente
   cria a linha ao clicar em baixar, não é um proxy que de fato intercepta o
   arquivo (mesmo nível de confiança do resto da vitrine). ---- */
async function criarDownloadEvento_(vitrinePbId, arquivoRef, token, senhaHash){
  return PB.collection('vitrine_downloads').create(
    { id_vitrine: vitrinePbId, arquivo_ref: arquivoRef, data: new Date().toLocaleDateString('pt-BR') },
    { token, senha_hash: senhaHash || '' }
  );
}

function aplicarTema_(vitrine){
  document.body.className = 'tema-' + (vitrine.tema || 'linen') + ' ' + (vitrine.tipografia === 'sans' ? 'sans' : 'serif');
  if (vitrine.cor_primaria) document.documentElement.style.setProperty('--accent', vitrine.cor_primaria);
}

function renderMensagem_(texto){
  app.innerHTML = `<div class="wrap"><div class="msg"><p>${escV(texto)}</p></div></div>`;
}

// Capa + título: montado e exibido IMEDIATAMENTE (antes de buscar as fotos),
// para o cliente ver a marca da fotógrafa na hora em vez de tela em branco.
// Logo da fotógrafa: mesma em TODAS as vitrines (uma marca só, não é por
// evento). Vazio = mostra o nome do estúdio em texto no lugar da logo.
// Link do Drive (convertido com driveImgUrl_, igual a capa) pra não depender
// de reupload se ela trocar a imagem — só trocar o link aqui.
const VITRINE_LOGO_URL = 'https://drive.google.com/file/d/1-H3KSrl5ltt8xZG5knr59z34mzaL5ijV/view?usp=sharing';

function montarCabecalho_(vitrine){
  const capaUrl = driveImgUrl_(vitrine.capa_url);
  const logoUrl = driveImgUrl_(VITRINE_LOGO_URL);
  return `
    <div class="header" id="header">
      <div class="header-info">
        ${logoUrl
          ? `<img class="header-logo" src="${escV(logoUrl)}" alt="Logo">`
          : `<p class="header-logo-texto">Cibele Matozo Fotografia</p>`}
        ${vitrine.subtitulo_exibicao ? `<p class="header-kicker">${escV(vitrine.subtitulo_exibicao)}</p>` : ''}
        <h1>${escV(vitrine.nome_exibicao || 'Suas fotos')}</h1>
        ${vitrine.data_exibicao ? `<p class="header-data">${escV(vitrine.data_exibicao)}</p>` : ''}
        <button type="button" class="btn-primary header-btn" id="btnVerGaleria">Ver galeria</button>
      </div>
      ${capaUrl ? `<div class="header-capa"><img src="${escV(capaUrl)}" alt=""></div>` : ''}
    </div>
  `;
}
function wirarHeader_(){
  const btn = document.getElementById('btnVerGaleria');
  if (btn) btn.addEventListener('click', () => {
    const wrap = document.querySelector('.wrap');
    if (wrap) wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
}

function renderSenha_(onSubmit){
  app.innerHTML = `
    <div class="wrap" style="max-width:420px;padding-top:80px;">
      <div class="painel">
        <h1 class="titulo" style="font-size:20px;margin:0 0 6px;">Esta galeria tem senha</h1>
        <p style="font-size:13.5px;opacity:.75;margin:0 0 18px;">Peça a senha para quem te enviou o link.</p>
        <form id="formSenha">
          <div class="field"><label>Senha</label><input type="password" id="senhaInput" autofocus></div>
          <div id="senhaErro" class="erro" style="display:none;"></div>
          <button class="btn-primary" type="submit" style="margin-top:14px;">Entrar</button>
        </form>
      </div>
    </div>
  `;
  document.getElementById('formSenha').addEventListener('submit', async (e) => {
    e.preventDefault();
    const senha = document.getElementById('senhaInput').value;
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(senha));
    const hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    try {
      await onSubmit(hash);
    } catch (err){
      document.getElementById('senhaErro').style.display = 'block';
      document.getElementById('senhaErro').textContent = 'Senha incorreta ou link expirado.';
    }
  });
}

function abrirLightbox_(src){
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `<button class="lightbox-fechar">&times;</button><img src="${src}">`;
  lb.addEventListener('click', (e) => { if (e.target === lb || e.target.classList.contains('lightbox-fechar')) lb.remove(); });
  document.body.appendChild(lb);
}

/* ---- Modal próprio (confirmar/avisar) — substitui confirm()/alert() do
   navegador, que vêm sem a marca/tema da vitrine. Reaproveita a classe
   .painel (já adapta sozinha por tema: linen/noir/terra). ---- */
function modalVitrine_(texto, comCancelar){
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="painel">
        <p>${escV(texto)}</p>
        <div class="modal-acoes">
          ${comCancelar ? `<button type="button" class="btn-secundario" id="mvCancelar">Cancelar</button>` : ''}
          <button type="button" class="btn-primary" id="mvOk">OK</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const fechar = (valor) => { overlay.remove(); resolve(valor); };
    overlay.querySelector('#mvOk').addEventListener('click', () => fechar(true));
    const btnCancelar = overlay.querySelector('#mvCancelar');
    if (btnCancelar) btnCancelar.addEventListener('click', () => fechar(false));
    overlay.addEventListener('click', (e) => { if (e.target === overlay) fechar(false); });
  });
}
function confirmarVitrine_(texto){ return modalVitrine_(texto, true); }
function avisarVitrine_(texto){ return modalVitrine_(texto, false); }

async function renderGaleria_(vitrine, senhaHash){
  aplicarTema_(vitrine);
  // Mostra a marca (capa/título) na hora e um spinner no lugar da grade —
  // só a listagem das fotos espera a rede (PocketBase ou Apps Script/Drive).
  app.innerHTML = `
    ${montarCabecalho_(vitrine)}
    <div class="wrap">
      <div class="spinner-wrap"><div class="spinner"></div><p>Carregando as fotos…</p></div>
    </div>
  `;
  wirarHeader_();

  // Marca d'água (v3.20.1): opcional por vitrine, vazio conta como "Sim" (igual
  // selecao_habilitada) — preserva o comportamento de sempre pras vitrines já
  // criadas. upload_proprio: decide servir 'preview' (marcado) ou 'arquivo'
  // (original). google_drive: a marca é aplicada DEPOIS do render inicial da
  // grade (ver aplicarMarcaDaguaDriveNaGrade_ logo abaixo), pra não atrasar o
  // primeiro carregamento com fetch+canvas de cada foto.
  const usarMarcaDagua = vitrine.marca_dagua_habilitada !== 'Não';
  let fotos = []; // { id, thumb, ver, baixar, nome, categoria, verLimpo, baixarLimpo }
  let erroFonte = '';
  try {
    if (vitrine.fonte_imagens === 'google_drive'){
      const arquivos = await buscarFotosDrive_(vitrine.link_pasta_drive);
      // `ver` usa a URL de thumbnail (em tamanho maior), não `downloadUrl`:
      // o endpoint de download do Drive bloqueia carregamento como <img>
      // cross-origin (403/CORB) — só o endpoint de thumbnail é embeddable.
      // Modo Drive não tem categoria (Apps Script não devolve isso) — por
      // isso verLimpo/baixarLimpo são os MESMOS que ver/baixar aqui; a marca
      // d'água (quando habilitada) é aplicada à parte, depois do primeiro
      // render (ver aplicarMarcaDaguaDriveNaGrade_), sem tocar nesses campos
      // "Limpo" — a entrega final nunca usa a versão marcada.
      fotos = arquivos.map(a => {
        const ver = 'https://drive.google.com/thumbnail?id=' + a.id + '&sz=w2000';
        return { id: a.id, thumb: a.thumbnailLink, ver, baixar: a.downloadUrl, thumbLimpo: a.thumbnailLink, verLimpo: ver, baixarLimpo: a.downloadUrl, nome: a.nome, categoria: '' };
      });
    } else {
      const regs = await buscarFotosProprio_(vitrine.id, TOKEN, senhaHash);
      // `download:1` força o PocketBase a mandar Content-Disposition:
      // attachment — sem isso, o atributo `download` do <a> é ignorado em
      // URL cross-origin (o arquivo fica noutro domínio da VM do PocketBase).
      // Por isso a versão para o lightbox (`ver`) NÃO leva a flag.
      // Usa o `preview` (com marca d'água, gerado no upload SE o switch da
      // vitrine estava ligado naquele momento — v3.20.1) quando existe E a
      // marca está habilitada nesta vitrine — inclusive para baixar durante
      // a navegação normal: sem uma entrega final liberada, servir o
      // `arquivo` original aqui esvaziaria a marca d'água. `verLimpo`/
      // `baixarLimpo` (arquivo original, sem marca) só são usados na seção de
      // entrega final, abaixo. Se o switch estava desligado NO UPLOAD, a
      // foto nunca ganhou `preview` — ligar o switch depois não aplica marca
      // retroativamente; só vale para fotos enviadas dali em diante.
      // Fotos enviadas antes da Fase 3 não têm `preview` — cai pro original.
      fotos = regs.map(f => {
        const campo = usarMarcaDagua && f.preview ? 'preview' : 'arquivo';
        return {
          id: f.id,
          thumb: PB.getFileUrl(f, f[campo], { thumb: '400x400' }),
          ver: PB.getFileUrl(f, f[campo]),
          baixar: PB.getFileUrl(f, f[campo], { download: 1 }),
          thumbLimpo: PB.getFileUrl(f, f.arquivo, { thumb: '400x400' }),
          verLimpo: PB.getFileUrl(f, f.arquivo),
          baixarLimpo: PB.getFileUrl(f, f.arquivo, { download: 1 }),
          nome: f.nome_original || f[campo],
          categoria: f.categoria || '',
        };
      });
    }
  } catch (err){
    erroFonte = err.message || String(err);
  }

  // Seleção: pode estar desligada pra esta vitrine (campo novo — vazio conta
  // como "Sim", então vitrines criadas antes desta mudança continuam com
  // seleção habilitada sem precisar editar nada). Quando desligada, nem
  // busca as seleções: é só galeria + download, sem corações/contador/
  // finalizar — pro caso de clientes que só querem disponibilizar tudo.
  const selecaoHabilitada = vitrine.selecao_habilitada !== 'Não';
  const finalizada = selecaoHabilitada && !!vitrine.selecao_finalizada_em;
  const selecionados = new Set(); // arquivo_ref (= id da foto)
  const selecaoPbIds = {}; // arquivo_ref -> id nativo da linha em vitrine_selecoes (pra desmarcar)
  if (!erroFonte && fotos.length && selecaoHabilitada){
    try {
      const sels = await buscarSelecoes_(vitrine.id, TOKEN, senhaHash);
      sels.forEach(s => { selecionados.add(String(s.arquivo_ref)); selecaoPbIds[s.arquivo_ref] = s.id; });
    } catch (err){
      // Não deixa a galeria inteira quebrar por causa disso — só fica sem
      // mostrar quem já tinha sido selecionado antes (cliente pode remarcar).
    }
  }

  const limite = Number(vitrine.qtd_fotos_pacote) || 0; // 0/vazio = sem limite
  function textoContador(){
    const n = selecionados.size;
    if (!limite) return n + ' selecionada' + (n === 1 ? '' : 's');
    if (n <= limite) return n + ' de ' + limite + ' selecionadas';
    return n + ' de ' + limite + ' selecionadas (+' + (n - limite) + ' extra' + ((n - limite) === 1 ? '' : 's') + ')';
  }

  // Entrega final (v3.19 Fase 4): se o cliente finalizou e tem fotos
  // selecionadas, entrega só as selecionadas; senão, entrega a galeria
  // inteira (ex.: eventos sem fluxo de seleção, álbum vai direto).
  // Enquanto a marca d'água do Drive ainda está sendo aplicada (em segundo
  // plano, foto por foto), "baixar" e "abrir em tela cheia" ficam bloqueados
  // em CADA card individualmente — sem isso, dava pra baixar a foto original
  // sem marca só clicando antes da vez dela ser processada.
  const protegerDrive = vitrine.fonte_imagens === 'google_drive' && usarMarcaDagua;
  const entregaInfo = construirEntrega_(vitrine, fotos, selecionados, finalizada);

  const wrap = app.querySelector('.wrap');
  wrap.innerHTML = `
      ${fotos.length ? `<p class="info-linha">${fotos.length} foto${fotos.length === 1 ? '' : 's'} nesta galeria${vitrine.validade ? ' · disponível até ' + escV(dataBRDeISO_(vitrine.validade)) : ''}</p>` : ''}
      ${finalizada ? `<div class="painel"><p style="margin:0;">✅ Seleção finalizada${vitrine.selecao_finalizada_em ? ' em ' + escV(dataBRDeISO_(vitrine.selecao_finalizada_em)) : ''} — ${escV(vitrine.qtd_fotos_selecionadas_final || 0)} foto(s) escolhida(s).</p></div>` : ''}
      ${fotos.length ? `
        <div class="acoes-topo">
          <span class="contador" id="contadorSelecao">${selecaoHabilitada && !finalizada ? textoContador() : ''}</span>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            ${selecaoHabilitada && !finalizada ? `<button id="finalizarSelecao">Finalizar seleção</button>` : ''}
            <button id="baixarTodas">Baixar todas as fotos</button>
          </div>
        </div>
      ` : ''}
      ${erroFonte ? `<div class="painel"><p class="erro" style="margin:0;">${escV(erroFonte)}</p></div>` : ''}
      ${!erroFonte && !fotos.length ? `<div class="painel"><p style="margin:0;opacity:.75;">Nenhuma foto disponível ainda nesta galeria.</p></div>` : ''}
      <div class="grid">
        ${fotos.map(f => `
          <div class="foto ${selecionados.has(String(f.id)) ? 'selecionada' : ''} ${protegerDrive ? 'pendente-marca' : ''}" data-ref="${escV(f.id)}">
            <img src="${escV(f.thumb)}" loading="lazy" data-ver="${escV(f.ver)}">
            ${selecaoHabilitada && !finalizada ? `<button class="coracao" data-ref="${escV(f.id)}" data-nome="${escV(f.nome)}" title="Selecionar">${selecionados.has(String(f.id)) ? '❤️' : '🤍'}</button>` : ''}
            <a class="baixar" href="${protegerDrive ? '#' : escV(f.baixar)}" download="${escV(f.nome)}" title="${protegerDrive ? "Aplicando marca d'água…" : 'Baixar'}" ${protegerDrive ? 'data-pendente="1"' : ''}>⬇</a>
          </div>
        `).join('')}
      </div>
      ${montarSecaoEntrega_(entregaInfo, vitrine)}
  `;
  app.querySelectorAll('.foto img').forEach(img => img.addEventListener('click', () => {
    if (img.closest('.foto').classList.contains('pendente-marca')){
      avisarVitrine_("Essa foto ainda está recebendo a marca d'água — aguarde alguns segundos e tente de novo.");
      return;
    }
    abrirLightbox_(img.dataset.ver);
  }));
  app.querySelectorAll('.foto a.baixar[data-pendente]').forEach(a => a.addEventListener('click', (e) => {
    if (a.dataset.pendente === '1'){
      e.preventDefault();
      avisarVitrine_("Essa foto ainda está recebendo a marca d'água — aguarde alguns segundos e tente de novo.");
    }
  }));

  // Modo Drive + marca d'água habilitada: a grade já está na tela com as
  // fotos originais (sem marca) — troca pra versão marcada em segundo plano,
  // foto por foto, assim que cada uma termina de processar. Enquanto isso não
  // termina, "Baixar todas" fica desabilitado — senão algumas fotos sairiam
  // marcadas e outras não, dependendo de quando o clique aconteceu.
  if (vitrine.fonte_imagens === 'google_drive' && usarMarcaDagua && fotos.length){
    const btnTodasPreparando = document.getElementById('baixarTodas');
    if (btnTodasPreparando){
      const rotuloOriginal = btnTodasPreparando.textContent;
      btnTodasPreparando.disabled = true;
      btnTodasPreparando.textContent = 'Preparando fotos…';
      aplicarMarcaDaguaDriveNaGrade_(fotos).finally(() => {
        btnTodasPreparando.disabled = false;
        btnTodasPreparando.textContent = rotuloOriginal;
      });
    } else {
      aplicarMarcaDaguaDriveNaGrade_(fotos);
    }
  }

  wrap.querySelectorAll('.coracao').forEach(btn => btn.addEventListener('click', async (e) => {
    e.stopPropagation();
    const ref = btn.dataset.ref;
    const card = btn.closest('.foto');
    btn.disabled = true;
    try {
      if (selecionados.has(ref)){
        await apagarSelecao_(selecaoPbIds[ref], TOKEN, senhaHash);
        selecionados.delete(ref);
        delete selecaoPbIds[ref];
        btn.textContent = '🤍';
        card.classList.remove('selecionada');
      } else {
        const rec = await criarSelecao_(vitrine.id, ref, btn.dataset.nome, TOKEN, senhaHash);
        selecionados.add(ref);
        selecaoPbIds[ref] = rec.id;
        btn.textContent = '❤️';
        card.classList.add('selecionada');
      }
      const contadorEl = document.getElementById('contadorSelecao');
      if (contadorEl) contadorEl.textContent = textoContador();
    } catch (err){
      await avisarVitrine_('Não foi possível atualizar a seleção: ' + (err.message || err));
    } finally {
      btn.disabled = false;
    }
  }));

  const btnFinalizar = document.getElementById('finalizarSelecao');
  if (btnFinalizar) btnFinalizar.addEventListener('click', async () => {
    if (!selecionados.size && !await confirmarVitrine_('Finalizar sem selecionar nenhuma foto?')) return;
    if (selecionados.size && !await confirmarVitrine_('Finalizar a seleção com ' + selecionados.size + ' foto(s)? Depois de finalizar não dá mais pra mudar.')) return;
    btnFinalizar.disabled = true;
    try {
      await criarFinalizacao_(vitrine.id, selecionados.size, TOKEN, senhaHash);
      vitrine.selecao_finalizada_em = new Date().toISOString();
      vitrine.qtd_fotos_selecionadas_final = selecionados.size;
      await renderGaleria_(vitrine, senhaHash); // re-renderiza já travada
    } catch (err){
      await avisarVitrine_('Não foi possível finalizar a seleção: ' + (err.message || err));
      btnFinalizar.disabled = false;
    }
  });

  const btnTodas = document.getElementById('baixarTodas');
  if (btnTodas) btnTodas.addEventListener('click', () => {
    if (btnTodas.disabled) return; // já em andamento, ou no gate de marca d'água do Drive
    btnTodas.disabled = true;
    baixarComoZip_(fotos, vitrine, btnTodas).catch((err) => {
      btnTodas.disabled = false;
      btnTodas.textContent = 'Baixar todas as fotos';
      avisarVitrine_('Não foi possível preparar o download: ' + (err.message || err));
    });
  });

  // Clique em "baixar" na entrega final CONTA (fire-and-forget: não atrasa
  // o download) e bloqueia cliques seguintes assim que bate o limite — o
  // download em si não é interceptado, é o mesmo nível de confiança do
  // resto da vitrine (ver pbSchema.js/vitrine_downloads).
  const maxDownloads = Number(vitrine.entrega_max_downloads) || 0;
  let downloadsFeitos = Number(vitrine.entrega_downloads_count) || 0;
  wrap.querySelectorAll('.entrega-baixar').forEach(a => a.addEventListener('click', (e) => {
    if (maxDownloads && downloadsFeitos >= maxDownloads){
      e.preventDefault();
      avisarVitrine_('O limite de downloads desta entrega já foi atingido.');
      return;
    }
    downloadsFeitos++;
    criarDownloadEvento_(vitrine.id, a.dataset.ref, TOKEN, senhaHash).catch(() => {});
  }));

  // "Baixar tudo em alta resolução": mesmo empacotamento em .zip usado em
  // "Baixar todas as fotos" (ver baixarComoZip_), mas sempre com os arquivos
  // limpos (baixarLimpo, nunca a versão marcada) e contando 1 download por
  // foto incluída — mesmo peso que um clique individual em ".entrega-baixar".
  const btnTudoEntrega = document.getElementById('baixarTudoEntrega');
  if (btnTudoEntrega) btnTudoEntrega.addEventListener('click', () => {
    if (btnTudoEntrega.disabled) return;
    if (maxDownloads && downloadsFeitos >= maxDownloads){
      avisarVitrine_('O limite de downloads desta entrega já foi atingido.');
      return;
    }
    btnTudoEntrega.disabled = true;
    const itensEntrega = (entregaInfo.itens || []).map(f => ({ id: f.id, nome: f.nome, baixar: f.baixarLimpo }));
    baixarComoZip_(itensEntrega, vitrine, btnTudoEntrega, {
      sufixo: 'entrega',
      aoConcluirFoto: (f) => {
        downloadsFeitos++;
        criarDownloadEvento_(vitrine.id, f.id, TOKEN, senhaHash).catch(() => {});
      },
    }).catch((err) => {
      btnTudoEntrega.disabled = false;
      btnTudoEntrega.textContent = 'Baixar tudo em alta resolução';
      avisarVitrine_('Não foi possível preparar o download: ' + (err.message || err));
    });
  });
}

// Decide o que (e se) mostrar na seção de entrega final, a partir do estado
// já carregado da vitrine — sem rede extra (os dados já vieram no fetch
// principal da vitrine/fotos/seleções).
function construirEntrega_(vitrine, fotos, selecionados, finalizada){
  if (!vitrine.entrega_liberada_em) return null;
  if (vitrine.entrega_validade){
    const limite = parseDataBR_(vitrine.entrega_validade);
    if (limite){
      limite.setHours(23, 59, 59, 999);
      if (new Date() > limite) return { expirada: true };
    }
  }
  const usarSelecionadas = finalizada && selecionados.size > 0;
  const itens = usarSelecionadas ? fotos.filter(f => selecionados.has(String(f.id))) : fotos.slice();
  if (!itens.length) return { vazia: true };
  const categorias = Array.from(new Set(itens.map(f => f.categoria || '')));
  return { itens, agrupar: categorias.length > 1, categorias };
}

function montarSecaoEntrega_(info, vitrine){
  if (!info) return '';
  if (info.expirada) return `<div class="entrega"><h2>📦 Entrega final</h2><p class="entrega-sub">O prazo para baixar em alta resolução já encerrou. Fale com a fotógrafa se precisar de um novo prazo.</p></div>`;
  if (info.vazia) return `<div class="entrega"><h2>📦 Entrega final</h2><p class="entrega-sub">Ainda não há fotos liberadas para entrega.</p></div>`;

  const max = Number(vitrine.entrega_max_downloads) || 0;
  const atual = Number(vitrine.entrega_downloads_count) || 0;
  const esgotado = max > 0 && atual >= max;
  const grupos = info.agrupar
    ? info.categorias.map(c => ({ nome: c || 'Geral', itens: info.itens.filter(f => (f.categoria || '') === c) }))
    : [{ nome: null, itens: info.itens }];

  return `
    <div class="entrega">
      <h2>📦 Entrega final</h2>
      <p class="entrega-sub">Fotos em alta resolução, sem marca d'água.${max ? ' Limite de ' + max + ' downloads' + (esgotado ? ' — já atingido.' : '.') : ''}</p>
      ${!esgotado && info.itens.length ? `<button id="baixarTudoEntrega" style="margin-bottom:14px;">Baixar tudo em alta resolução</button>` : ''}
      ${esgotado ? `<div class="painel"><p style="margin:0;">Limite de downloads atingido. Fale com a fotógrafa se precisar de mais.</p></div>` : grupos.map(g => `
        ${g.nome ? `<p class="album-titulo">${escV(g.nome)}</p>` : ''}
        <div class="grid">
          ${g.itens.map(f => `
            <div class="foto">
              <img src="${escV(f.thumbLimpo)}" loading="lazy" data-ver="${escV(f.verLimpo)}">
              <a class="baixar entrega-baixar" href="${escV(f.baixarLimpo)}" download="${escV(f.nome)}" data-ref="${escV(f.id)}" title="Baixar em alta resolução">⬇</a>
            </div>
          `).join('')}
        </div>
      `).join('')}
    </div>
  `;
}

async function iniciar(){
  if (!TOKEN){ renderMensagem_('Link inválido — confira se copiou o endereço completo.'); return; }
  try {
    const vitrine = await buscarVitrine_(TOKEN, '');
    await renderGaleria_(vitrine, '');
  } catch (err){
    // Não dá para saber SE falhou por senha, validade ou token errado (a regra
    // do PocketBase só "esconde" o registro) — tenta com senha antes de desistir.
    renderSenha_(async (hash) => {
      const vitrine = await buscarVitrine_(TOKEN, hash);
      await renderGaleria_(vitrine, hash);
    });
  }
}
iniciar();
</script>
